<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Getting Started: Serving Web Content</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
<div class="container">
    <a th:href="@{/hoc-ky/add}">Add</a>
    <br/>
    <table id="custom-table" class="table table-bordered w-100" cellspacing="0">
        <thead>
        <tr>
            <th>STT</th>
            <th>Tên học kỳ</th>
            <th class="w-action-3">Function</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="hocKy,i : ${listHocKy}">
            <tr>
                <td th:text="${i.count}"></td>
                <td th:text="${hocKy.tenHocKy}"></td>
                <td><a th:href="@{/hoc-ky/update/{id}(id=${hocKy.hocKyId})}">Update</a></td>
                <td><a th:href="@{/hoc-ky/remove/{id}(id=${hocKy.hocKyId})}">Remove</a></td>
            </tr>
        </th:block>
        </tbody>
    </table>
    <nav aria-label="Page navigation example">
        <ul class="pagination">
            <div th:each="i:${#numbers.sequence( 1, numberPaging, 1)}">
                <li class="page-item">
                    <a class="page-link" th:href="@{/hoc-ky/lists?page={number}(number=${i}-1)}"
                       th:text="${i}">
                    </a>
                </li>
            </div>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.5/dist/umd/popper.min.js"
        integrity="sha384-Xe+8cL9oJa6tN/veChSP7q+mnSPaj5Bcu9mPX5F5xIGE0DVittaqT5lorf0EI7Vk"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.min.js" i
</body>
</html>
