<!DOCTYPE html>
<html lang="en">
<!-- begin::Head -->
<head>
    <meta charset="utf-8"/>
    <title>Project Register System</title>
    <meta name="description" content="Static table examples">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <link th:href="@{/assets/vendors/base/vendors.bundle.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/demo/default/base/style.bundle.css}" rel="stylesheet" type="text/css"/>
    <link rel="shortcut icon" href="https://ap.poly.edu.vn/images/favicon.ico"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/plugin/query-ui.css}">
</head>
<!-- end::Head -->

<!-- begin::Body -->
<body class="m-page--fluid m--skin- m-content--skin-light2 m-header--fixed m-header--fixed-mobile m-aside-left--enabled m-aside-left--skin-dark m-aside-left--fixed m-aside-left--offcanvas m-footer--push m-aside--offcanvas-default">

<!-- begin:: Page -->
<div class="m-grid m-grid--hor m-grid--root m-page">

    <div th:insert="~{fragment/header_fragment :: header}"></div>

    <!-- begin::Body -->
    <div class="m-grid__item m-grid__item--fluid m-grid m-grid--ver-desktop m-grid--desktop m-body">

        <div th:insert="~{fragment/menu_fragment :: menu}"></div>

        <!-- END: Left Aside -->
        <div class="m-grid__item m-grid__item--fluid m-wrapper">
            <!-- END: Subheader -->
            <div>
                <div class="m-content">
                    <h3>Quản lý học kỳ</h3>
                    <div class="mt-5">
                        <section class="fillter-area  mb-5">
                            <div class="m-portlet">
                                <div class="m-portlet__head">
                                    <div class="m-portlet__head-caption">
                                        <div class="m-portlet__head-title">
                                <span class="m-portlet__head-icon">
                                    <i class="m-menu__link-icon flaticon-web"></i>
                                </span>
                                            <h3 class="m-portlet__head-text">
                                                Bộ lọc
                                            </h3>
                                        </div>
                                    </div>
                                </div>
                                <form
                                        th:action="@{/hoc-ky/list}"
                                        method="GET"
                                        class="m-portlet__body">
                                    <div class="row">
                                        <div
                                                class="form-group d-inline col-md-6 col-12 d-flex justify-content-around align-items-center">
                                            <span for="" class="fillter-name col-4 text-center">Tên học kỳ</span>
                                            <input type="text" class="form-control col-8" name="keyword" id="keyword"
                                                   value="">
                                        </div>
                                    </div>

                                    <div class="row justify-content-center pt-2">
                                        <div class="col-sm-2 col-12 text-center mt-2">
                                            <button type="submit" class="btn btn-primary">Tìm kiếm</button>
                                        </div>
                                        <div class="col-sm-2 col-12 text-center mt-2">
                                            <a href="#"
                                               class="btn btn-danger text-white" onclick="clearData();">
                                                Làm mới bộ lọc
                                            </a>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </section>

                        <div class="m-portlet">
                            <div class="m-portlet">
                                <div class="m-portlet__body">
                                    <div class="row">
                                        <div class="col-6 d-inline">
                                            <button
                                                    data-toggle="modal"
                                                    data-target="#modal_create"
                                                    class="col-4 btn btn-success">
                                                Thêm học kỳ
                                            </button>

                                            <div class="modal fade"
                                                 id="modal_create"
                                                 tabindex="-1"
                                                 aria-labelledby="exampleModalLabel"
                                                 aria-hidden="true">
                                                <div class="modal-dialog modal-lg">
                                                    <div class="modal-content">
                                                        <form id="form_create_hoc_ky">
                                                            <div class="modal-header">
                                                                <h5 class="modal-title" id="exampleModalLabel">Thêm học
                                                                    kỳ</h5>
                                                                <button type="button" class="close" data-dismiss="modal"
                                                                        aria-label="Close">
                                                                    <span aria-hidden="true">&times;</span>
                                                                </button>
                                                            </div>
                                                            <div class="modal-body">
                                                                <div class="form-group">
                                                                    <label class="col-form-label">Học kỳ</label>
                                                                    <input
                                                                            type="text"
                                                                            class="form-control"
                                                                            name="tenHocKy"
                                                                            id="tenHocKy">
                                                                    <span class="text-danger"
                                                                          id="hoc_ky_error"></span>
                                                                </div>
                                                            </div>
                                                            <div class="modal-footer">
                                                                <button type="button" class="btn btn-secondary"
                                                                        data-dismiss="modal">Hủy
                                                                </button>
                                                                <button type="submit" class="btn btn-primary">Thêm mới
                                                                </button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <br/>
                                        <table id="custom-table"
                                               class="table table-bordered m-table d-sm-table m-table--head-bg-primary table-responsive">
                                            <thead>
                                            <th scope="col" style="width: 10%;">STT</th>
                                            <th>Tên Hoc Kỳ</th>
                                            <th style="width: 10%;">Chức năng</th>
                                            </thead>
                                            <tbody>
                                            <th:block th:each="hocKy,i : ${listHocKy}">
                                                <tr>
                                                    <td th:text="${i.count}"></td>
                                                    <td th:text="${hocKy.tenHocKy}"></td>
                                                    <td>
                                                        <button
                                                                type="button"
                                                                class="btn btn-primary"
                                                                data-toggle="modal"
                                                                th:attr="data-target='#update'+${hocKy.hocKyId}">
                                                            Sửa
                                                        </button>
                                                        <button
                                                                type="button"
                                                                class="btn btn-primary"
                                                                data-toggle="modal"
                                                                th:attr="data-target='#remove'+${hocKy.hocKyId}">
                                                            Xoá
                                                        </button>
                                                    </td>
                                                </tr>

                                                <!--  Start Modal Update-->
                                                <div
                                                        class="modal fade"
                                                        th:id="update+${hocKy.hocKyId}"
                                                        tabindex="-1"
                                                        aria-labelledby="exampleModalLabel"
                                                        aria-hidden="true">
                                                    <div class="modal-dialog modal-dialog-centered modal-lg modal-lg"
                                                         role="document">
                                                        <div class="modal-content">
                                                            <form method="POST" id="form-hoc-ky-update"
                                                                  th:action="@{/hoc-ky/update/{id}(id=${hocKy.hocKyId})}">
                                                                <div class="modal-header">
                                                                    <h5 class="modal-title">Cập
                                                                        nhật học kỳ</h5>
                                                                    <button type="button" class="close"
                                                                            data-dismiss="modal" aria-label="Close">
                                                                        <span aria-hidden="true">&times;</span>
                                                                    </button>
                                                                </div>
                                                                <div class="modal-body">
                                                                    <div class="form-group">
                                                                        <label
                                                                                class="col-form-label">ID Học Kỳ</label>
                                                                        <input
                                                                                type="text"
                                                                                class="form-control"
                                                                                th:disabled="true"
                                                                                th:value=${hocKy.hocKyId}>
                                                                    </div>
                                                                    <div class="form-group">
                                                                        <label
                                                                                class="col-form-label">Tên Học
                                                                            Kỳ</label>
                                                                        <input
                                                                                type="text"
                                                                                class="form-control"
                                                                                id="tenHocKyUpdate"
                                                                                name="tenHocKyUpdate"
                                                                                th:value=${hocKy.tenHocKy}>
                                                                        <small class="text-danger"
                                                                               id="errorMessage"
                                                                               th:if="${errorMessage}"
                                                                               th:utext="${errorMessage}"></small>
                                                                    </div>
                                                                </div>
                                                                <div class="modal-footer">
                                                                    <button type="button" class="btn btn-secondary"
                                                                            data-dismiss="modal">Hủy
                                                                    </button>
                                                                    <button type="submit" class="btn btn-primary">Cập
                                                                        nhật
                                                                    </button>
                                                                </div>
                                                            </form>
                                                        </div>
                                                    </div>
                                                </div>
                                                <!--   End Modal Update -->
                                                <!--  Start Modal Remove-->
                                                <div
                                                        class="modal fade"
                                                        th:id="remove+${hocKy.hocKyId}"
                                                        tabindex="-1"
                                                        aria-labelledby="exampleModalLabel"
                                                        aria-hidden="true">
                                                    <div class="modal-dialog modal-dialog-centered modal-lg modal-lg"
                                                         role="document">
                                                        <div class="modal-content">
                                                            <form method="POST"
                                                                  th:action="@{/hoc-ky/remove/{id}(id=${hocKy.hocKyId})}">
                                                                <div class="modal-header">
                                                                    <h5 class="modal-title">Xoá học kỳ</h5>
                                                                    <button type="button" class="close"
                                                                            data-dismiss="modal" aria-label="Close">
                                                                        <span aria-hidden="true">&times;</span>
                                                                    </button>
                                                                </div>
                                                                <div class="modal-body">
                                                                    <p>Bạn có muốn xoá không ?</p>
                                                                </div>
                                                                <div class="modal-footer">
                                                                    <button type="button" class="btn btn-secondary"
                                                                            data-dismiss="modal">Hủy
                                                                    </button>
                                                                    <button type="submit" class="btn btn-primary">Xoá
                                                                    </button>
                                                                </div>
                                                            </form>
                                                        </div>
                                                    </div>
                                                </div>
                                                <!--   End Modal Remove -->
                                            </th:block>
                                            </tbody>
                                        </table>
                                        <!-- Paging-->
                                        <nav aria-label="Page navigation ">
                                            <ul class="pagination justify-content-end">
                                                <div th:each="i:${#numbers.sequence( 1, numberPaging, 1)}">
                                                    <li class="page-item">
                                                        <a class="page-link"
                                                           th:href="@{/hoc-ky/list?page={number}(number=${i}-1)}"
                                                           th:text="${i}">
                                                        </a>
                                                    </li>
                                                </div>
                                            </ul>
                                        </nav>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- end:: Body -->
</div>

<script th:src="@{/assets/vendors/base/vendors.bundle.js}" type="text/javascript"></script>
<script th:src="@{/assets/demo/default/base/scripts.bundle.js}" type="text/javascript"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.0.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-modal/0.9.1/jquery.modal.min.js"></script>
<script src="https://code.jquery.com/jquery-3.3.1.slim.js"></script>
<script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
<script th:src="@{/js/custom/hocKy.js}" type="text/javascript"></script>
</body>
</html>
