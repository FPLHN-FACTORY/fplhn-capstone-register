<!DOCTYPE html>
<html lang="en">
<!-- begin::Head -->
<head>
    <meta charset="utf-8"/>
    <title>Project Register System</title>
    <meta name="description" content="Static table examples">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <link th:href="@{/assets/vendors/base/vendors.bundle.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/demo/default/base/style.bundle.css}" rel="stylesheet" type="text/css"/>
    <link rel="shortcut icon" href="https://ap.poly.edu.vn/images/favicon.ico"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/plugin/query-ui.css}">
</head>
<!-- end::Head -->

<body class="m-page--fluid m--skin- m-content--skin-light2 m-header--fixed m-header--fixed-mobile m-aside-left--enabled m-aside-left--skin-dark m-aside-left--fixed m-aside-left--offcanvas m-footer--push m-aside--offcanvas-default">

<!-- begin:: Page -->
<div class="m-grid m-grid--hor m-grid--root m-page">

    <div th:insert="~{fragment/header-fragment :: header}"></div>

    <!-- begin::Body -->
    <div class="m-grid__item m-grid__item--fluid m-grid m-grid--ver-desktop m-grid--desktop m-body">

        <div th:insert="~{fragment/menu-fragment :: menu}"></div>

        <!-- END: Left Aside -->
        <div class="m-grid__item m-grid__item--fluid m-wrapper">
            <!-- END: Subheader -->
            <div>
                <div class="m-content">
                    <h3>Quản lý nhóm dự án tốt nghiệp </h3>
                    <div class="mt-5">
                        <section class="fillter-area  mb-5">
                            <div class="m-portlet">
                                <div class="m-portlet__head">
                                    <div class="m-portlet__head-caption">
                                        <div class="m-portlet__head-title">
                                <span class="m-portlet__head-icon">
                                    <i class="m-menu__link-icon flaticon-web"></i>
                                </span>
                                            <h3 class="m-portlet__head-text">
                                                Bộ lọc
                                            </h3>
                                        </div>
                                    </div>
                                </div>
                                <br>
                                <form id="form_list_giang_vien">
                                    <div class="row">
                                        <div class="form-group d-inline col-md-6 col-12 d-flex justify-content-around align-items-center">
                                            <span for="" class="fillter-name col-4 text-center">Chuyên ngành:</span>
                                            <select class="form-control col-7" id="tenChuyenNganh" name="tenChuyenNganh">
                                                <option value="" hidden>Chọn chuyên ngành</option>
                                                <option th:each="item : ${listChuyenNganh}" th:value="${item.getId()}" th:text="${item.getName()}"></option>
                                            </select>
                                        </div>
                                        <div class="form-group d-inline col-md-6 col-12 d-flex justify-content-around align-items-center">
                                            <span for="" class="fillter-name col-4 text-center">Hoc kỳ:</span>
                                            <select class="form-control col-7" id="tenHocKy" name="tenGvhd">
                                                <option value="" hidden>Chọn Học Kỳ</option>
                                                <option th:each="item : ${listHocKy}" th:value="${item.getId()}" th:text="${item.getName()}"></option>
                                            </select>
                                        </div>
                                        <div class="form-group d-inline col-md-6 col-12 d-flex justify-content-around align-items-center">
                                            <span for="" class="fillter-name col-4 text-center">Đợt đăng ký:</span>
                                            <select class="form-control col-7" id="tenDotDangKy" name="tenDotDangKy">
                                                <option value="" hidden>Đợt đăng ký</option>
                                                <option th:each="item : ${listDotDangKy}" th:value="${item.getId()}" th:text="${item.getName()}"></option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="row justify-content-center pt-2">
                                        <div class="col-sm-2 col-12 text-center mt-2">
                                            <button type="submit" class="btn btn-primary" onclick="seachNhomdatn()">Tìm kiếm</button>
                                        </div>
                                        <div class="col-sm-2 col-12 text-center mt-2">
                                            <a href="#" class="btn btn-danger text-white" onclick="clearDataGVHD();">
                                                Làm mới bộ lọc
                                            </a>
                                        </div>
                                    </div>
                                </form>
                                <br>
                            </div>
                        </section>
                        <div class="m-portlet">
                            <div class="m-portlet">
                                <div class="m-portlet__body">
                                    <div class="table-responsive mt-3">
                                        <table id="custom-table"
                                               class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                            <thead>
                                            <th width="50px">STT</th>
                                            <th>Tên nhóm</th>
                                            <th>Tên đề tài</th>
                                            <th>Chuyên ngành</th>
                                            <th>Số thành viên</th>
                                            <th>Trưởng nhóm</th>
                                            <th>GV hướng dẫn</th>
                                            <th>Trạng thái</th>
                                            <th>Chi tiết nhóm</th>
                                            <th>Hành động</th>
                                            </thead>
                                            <tbody id = "list_nhom_datn">
                                            <th:block th:each="nhomDatn : ${page.data}">
                                                <tr>
                                                    <td th:text="${nhomDatn.getStt()}"></td>
                                                    <td th:text="${nhomDatn.getTenNhom()}"></td>
                                                    <td th:text="${nhomDatn.getTenDeTai()}"></td>
                                                    <td th:text="${nhomDatn.getTenChuyenNganh()}"></td>
                                                    <td th:text="${nhomDatn.getTotalMaSinhVien()}"></td>
                                                    <td th:text="${nhomDatn.getTenTruongNhom()} + ' - '+ ${nhomDatn.getMaTruongNhom()} ">
                                                    </td>
                                                    <td th:text="${nhomDatn.getTenGvhd()} + ' - ' + ${nhomDatn.getAccountGvhd()} "></td>
                                                    <td th:text="${nhomDatn.getTrangThai()}==0?'Chưa chốt đề tài':(${nhomDatn.getTrangThai()}==1?'Giáo viên đã chốt':'CNBM đã chốt')"></td>
                                                    <td>
                                                        <button
                                                                type="button"
                                                                class="btn btn-primary"
                                                                th:attr="onclick=|showDetail('${nhomDatn.getId()}')|">
                                                            chi tiết nhóm
                                                        </button>
                                                    </td>
                                                    <td>
                                                        <button
                                                                type="button"
                                                                class="btn btn-primary"
                                                                id="chotDuLieu" th:style="${nhomDatn.getTrangThai()} == 1 ? 'display: none' : 'display: block'"
                                                                th:attr="onclick=|chotDuLieu('${nhomDatn.getId()}')|">Chốt
                                                        </button>
                                                </tr>
                                            </th:block>
                                            </tbody>
                                        </table>
                                        <!-- Paging-->
                                        <nav th:if="${page.totalPages > 1}" aria-label="Page navigation" >
                                            <ul class="pagination justify-content-end" id="page">
                                                <div th:each="i:${#numbers.sequence( 1, page.totalPages, 1)}" >
                                                    <li class="page-item">
                                                        <a class="page-link"
                                                           th:href="@{/giang-vien/nhom-datn?page={page.currentPage}(page.currentPage=${i}-1)}"
                                                           th:text="${i}" id="currentPage">
                                                        </a>
                                                    </li>
                                                </div>
                                            </ul>
                                        </nav>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- end:: Body -->
</div>
<!--  Start list sinh vien -->
<div
        class="modal fade"
        tabindex="-1"
        id="form-showDetail"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true">
    <div class="modal-dialog modal-lg modal-lg"
         role="document">
        <div class="modal-content">
            <div class="modal-body">
                <form id="list_sinh_vien_nhom_datn">
                    <div class="modal-header">
                        <h5 class="modal-title">Danh Sách sinh Viên</h5>
                        <button type="button" class="close"
                                data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <table
                            class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                        <thead>
                        <th>STT</th>
                        <th>Mã Sinh Viên</th>
                        <th>Tên Sinh Viên</th>
                        <th>Số điện thoại</th>
                        <th>Email</th>
                        <th>Khoa</th>
                        </thead>
                        <tbody id="table_body_dssv">
                        </tbody>
                    </table>
                </form>
            </div>
        </div>
    </div>
</div>
<!--   End list sinh vien-->


<script th:src="@{/assets/vendors/base/vendors.bundle.js}" type="text/javascript"></script>
<script th:src="@{/assets/demo/default/base/scripts.bundle.js}" type="text/javascript"></script>
<script src="https://code.jquery.com/jquery-3.3.1.js"></script>
<script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
<script th:src="@{/js/custom/giangvien/gvNhomDatn.js}" type="text/javascript"></script>
</body>
</html>
