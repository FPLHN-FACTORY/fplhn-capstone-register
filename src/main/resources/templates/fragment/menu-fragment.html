<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- begin::Head -->
<head>
</head>
<body>
<div th:fragment="menu">
    <button
            class="m-aside-left-close  m-aside-left-close--skin-light"
            id="m_aside_left_close_btn">
        <i class="la la-close"></i>
    </button>
    <div id="m_aside_left" class="m-grid__item m-aside-left m-aside-left--skin-dark">
        <div id="m_ver_menu" style="position: relative;"
             class="m-aside-menu m-aside-menu--skin-light m-aside-menu--submenu-skin-light"
             m-menu-vertical="1" m-menu-scrollable="1" m-menu-dropdown-timeout="500">
            <ul class="m-menu__nav m-menu__nav--dropdown-submenu-arrow">
                <th:block th:switch="${session.role}">

                    <div th:case="'dao-tao'">
                        <li class="m-menu__item m-menu__item--submenu"
                            aria-haspopup="true" m-menu-submenu-toggle="hover">
                            <a href="http://localhost:8000/staff/pdt/sinh-vien/danh-sach-sinh-vien"
                               class="m-menu__link m-menu__toggle">
                                <i class="m-menu__link-icon flaticon-graphic"></i>
                                <span class="m-menu__link-text">Quản lý sinh viên</span>
                            </a>
                        </li>
                    </div>

                    <div th:case="'chu-nhiem'">
                        <li class="m-menu__item m-menu__item--submenu"
                            aria-haspopup="true" m-menu-submenu-toggle="hover">
                            <a href="http://localhost:8000/staff/pdt/sinh-vien/danh-sach-sinh-vien"
                               class="m-menu__link m-menu__toggle">
                                <i class="m-menu__link-icon flaticon-graphic"></i>
                                <span class="m-menu__link-text">Quản lý sinh viên</span>
                            </a>
                        </li>
                    </div>

                    <div th:case="'giang-vien'">
                        <li class="m-menu__item m-menu__item--submenu"
                            aria-haspopup="true" m-menu-submenu-toggle="hover">
                            <a href="http://localhost:8000/staff/pdt/sinh-vien/danh-sach-sinh-vien"
                               class="m-menu__link m-menu__toggle">
                                <i class="m-menu__link-icon flaticon-graphic"></i>
                                <span class="m-menu__link-text">Quản lý sinh viên</span>
                            </a>
                        </li>
                    </div>

                    <div th:case="'sinh-vien'">
                        <li class="m-menu__item m-menu__item--submenu"
                            aria-haspopup="true" m-menu-submenu-toggle="hover">
                            <a href="/sinh-vien/"
                               class="m-menu__link m-menu__toggle">
                                <i class="m-menu__link-icon flaticon-graphic"></i>
                                <span class="m-menu__link-text">Quản lý sinh viên</span>
                            </a>
                        </li>
                    </div>

                </th:block>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
