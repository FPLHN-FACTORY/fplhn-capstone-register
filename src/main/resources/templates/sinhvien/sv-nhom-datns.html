<!DOCTYPE html>
<html lang="en">
<!-- begin::Head -->
<head>
    <meta charset="utf-8"/>
    <title>Project Register System</title>
    <meta name="description" content="Static table examples">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <link th:href="@{/assets/vendors/base/vendors.bundle.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/demo/default/base/style.bundle.css}" rel="stylesheet" type="text/css"/>
    <link rel="shortcut icon" href="https://ap.poly.edu.vn/images/favicon.ico"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/plugin/query-ui.css}">
</head>
<body class="m-page--fluid m--skin- m-content--skin-light2 m-header--fixed m-header--fixed-mobile m-aside-left--enabled m-aside-left--skin-dark m-aside-left--fixed m-aside-left--offcanvas m-footer--push m-aside--offcanvas-default">

<!-- begin:: Page -->
<div class="m-grid m-grid--hor m-grid--root m-page">

    <div th:insert="~{fragment/header-fragment :: header}"></div>

    <!-- begin::Body -->
    <div class="m-grid__item m-grid__item--fluid m-grid m-grid--ver-desktop m-grid--desktop m-body">

        <div th:insert="~{fragment/menu-fragment-dao-tao :: menu}"></div>

        <!-- END: Left Aside -->
        <div class="m-grid__item m-grid__item--fluid m-wrapper">
            <!-- END: Subheader -->
            <div>
                <div>
                    <h3 style="margin: 50px 0 0 50px;">Nhóm Dự Án Tốt Nghiệp</h3>
                    <div class="m-content" style="margin: 50px 0 0 50px ; background-color: #fff; width: 1200px;">

                        <div id="main">
                            <div class="kt-grid__item kt-grid__item--fluid kt-app__content">
                                <div class="row">
                                    <div class="col-xl-12">
                                        <div class="kt-portlet">
                                            <div class="kt-portlet__head">
                                                <div class="kt-portlet__head-label">
                                                    <h3 class="kt-portlet__head-title"
                                                        style="margin: 20px 200px 10px 50px;">Thông tin Nhóm Dự Án Tốt
                                                        Nghiệp Tham Gia</h3>
                                                </div>
                                            </div>
                                            <!--                        begin Đổi tên đề tài-->
                                            <div
                                                    class="modal fade"
                                                    tabindex="-1"
                                                    id="modal_doi_ten_de_Tai"
                                                    aria-labelledby="exampleModalLabel"
                                                    aria-hidden="true">
                                                <div class="modal-dialog modal-lg modal-lg"
                                                     role="document">
                                                    <div class="modal-content">
                                                        <form id="form_doi_ten_de_tai">
                                                            <div class="modal-header">
                                                                <h5 class="modal-title">Đổi tên đề tài</h5>
                                                                <button type="button" class="close"
                                                                        data-dismiss="modal" aria-label="Close">
                                                                    <span aria-hidden="true">&times;</span>
                                                                </button>
                                                            </div>
                                                            <div class="modal-body">
                                                                <div class="form-group">
                                                                    <br>
                                                                    <label class="col-form-label">Tên đề tài</label>
                                                                    <input
                                                                            type="text"
                                                                            class="form-control"
                                                                            id="inputTenDeTai">
                                                                    <span class="text-danger"
                                                                          id="errorTenDeTai"></span><br>
                                                                </div>
                                                            </div>
                                                            <div class="modal-footer">
                                                                <button type="button" class="btn btn-secondary"
                                                                        data-dismiss="modal">Hủy
                                                                </button>
                                                                <button
                                                                        type="button" class="btn btn-primary"
                                                                        th:attr="onclick=|doiTenDeTai()|"
                                                                >Tham gia nhóm
                                                                </button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                            <!--                        end Đổi tên đề tài-->
                                            <!--        Begin confirm Success         -->
                                            <div
                                                    class="modal fade"
                                                    tabindex="-1"
                                                    id="modal_confirm_success"
                                                    aria-labelledby="exampleModalLabel"
                                                    aria-hidden="true">
                                                <div class="modal-dialog modal-lg modal-lg"
                                                     role="document">
                                                    <div class="modal-content">
                                                        <form id="form_confirm_success">
                                                            <div class="modal-header">
                                                                <h5 class="modal-title">Thông báo</h5>
                                                                <button type="button" class="close"
                                                                        data-dismiss="modal" aria-label="Close">
                                                                    <span aria-hidden="true">&times;</span>
                                                                </button>
                                                            </div>
                                                            <div class="modal-body">
                                                                <div class="form-group">
                                                                    <br>
                                                                    <h4 id="messageSuccess"></h4>
                                                                </div>
                                                            </div>
                                                            <div class="modal-footer">
                                                                <button type="submit" class="btn btn-primary">OK
                                                                </button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                            <!--        End confirm Success                -->
                                            <form class="kt-form kt-form--label-right">
                                                <div class="kt-portlet__body">
                                                    <div class="kt-section kt-section--first">
                                                        <div class="form-group row">
                                                            <label class="col-xl-3 col-lg-3 col-form-label">Mã
                                                                nhóm</label>
                                                            <div class="col-lg-9 col-xl-6">
                                                                <input type="text"
                                                                       th:value="${nhomDatnThamGia[0].maNhom}"
                                                                       readonly="readonly" class="form-control">
                                                            </div>
                                                        </div>
                                                        <div class="form-group row">
                                                            <label class="col-xl-3 col-lg-3 col-form-label">Tên
                                                                nhóm</label>
                                                            <div class="col-lg-9 col-xl-6">
                                                                <input type="text"
                                                                       th:value="${nhomDatnThamGia[0].tenNhom}"
                                                                       readonly="readonly" class="form-control">
                                                            </div>
                                                        </div>
                                                        <div class="form-group row">
                                                            <label class="col-xl-3 col-lg-3 col-form-label">Tên đợt đăng
                                                                ký</label>
                                                            <div class="col-lg-9 col-xl-6">
                                                                <input type="text"
                                                                       th:value="${nhomDatnThamGia[0].tenDotDangKy}"
                                                                       readonly="readonly" class="form-control">
                                                            </div>
                                                        </div>
                                                        <div class="form-group row">
                                                            <label class="col-xl-3 col-lg-3 col-form-label">Tên đề
                                                                tài</label>
                                                            <div class="col-lg-9 col-xl-6">
                                                                <input type="text"
                                                                       th:value="${nhomDatnThamGia[0].tenDeTai}"
                                                                       readonly="readonly" class="form-control">
                                                            </div>
                                                        </div>
                                                        <div class="form-group row">
                                                            <label class="col-xl-3 col-lg-3 col-form-label">Tên
                                                                GVHD</label>
                                                            <div class="col-lg-9 col-xl-6">
                                                                <input type="text"
                                                                       th:value="${nhomDatnThamGia[0].tenGvhd}"
                                                                       readonly="readonly" class="form-control">
                                                            </div>
                                                        </div>
                                                        <div class="form-group row">
                                                            <label class="col-xl-3 col-lg-3 col-form-label">Trạng
                                                                thái</label>
                                                            <div class="col-lg-9 col-xl-6">
                                                                <input type="text"
                                                                       th:value="${T(com.fpolydatn.util.TrangThaiNhomUtils).ConvertToTrangThai(nhomDatnThamGia[0].getTrangThai())}"
                                                                       readonly="readonly" class="form-control">
                                                            </div>
                                                        </div>
                                                        <div class="form-group row">
                                                            <label class="col-xl-3 col-lg-3 col-form-label">Nhận
                                                                xét</label>
                                                            <div class="col-lg-9 col-xl-6">
                                                                <textarea
                                                                        th:text="${nhomDatnThamGia[0].getNhanXet()}"
                                                                        readonly="readonly" class="form-control">
                                                                </textarea>
                                                            </div>
                                                        </div>
                                                        <button
                                                                data-toggle="modal"
                                                                data-target="#modal_create"
                                                                class="btn btn-primary"
                                                                th:style="${checkTruongNhom} == false ? 'display:none' : (${nhomDatnThamGia[0].getTrangThai()} == 1  ?
                                                                'display: block' : (${nhomDatnThamGia[0].getTrangThai()} == 3 ? 'display: block' :   'display: none'))"
                                                                th:attr="onclick=|guiYeuCauPheDuyet('${nhomDatnThamGia[0].getId()}')|"
                                                        >
                                                            Gửi yêu cầu phê duyệt
                                                        </button>
                                                        <button
                                                                th:style="${checkTruongNhom} == false ? 'display:none' : (${nhomDatnThamGia[0].getTrangThai()} == 1  ?
                                                                'display: block' : (${nhomDatnThamGia[0].getTrangThai()} == 3 ? 'display: block' :   'display: none'))"
                                                                type="button" class="btn btn-primary"
                                                                data-target="#modal_doi_ten_de_Tai"
                                                                th:attr="onclick=|openModalDoiTenDeTai()|"
                                                        >Đổi tên đề tài
                                                        </button>
                                                        <br>
                                                        <h3>Danh sách thành viên nhóm</h3>
                                                        <div class="modal-body">
                                                            <div class="form-group">
                                                                <table id="custom-table"
                                                                       class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                                                    <thead>
                                                                    <th width="50px">STT</th>
                                                                    <th>Mã Sinh Viên</th>
                                                                    <th>Tên Sinh Viên</th>
                                                                    <th>Chức Vụ</th>
                                                                    </thead>
                                                                    <tbody>
                                                                    <th:block th:each="SvnhomDatn : ${nhomDatnThamGia}">
                                                                        <tr>
                                                                            <td th:text="${SvnhomDatn.getStt()}"></td>
                                                                            <td th:text="${SvnhomDatn.getMaSinhVien()}"></td>
                                                                            <td th:text="${SvnhomDatn.getTenSinhVien()}"></td>
                                                                            <td th:text="${SvnhomDatn.getChucVu()}"></td>
                                                                        </tr>
                                                                    </th:block>
                                                                    </tbody>
                                                                </table>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                        </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- end:: Body -->
</div>

<script th:src="@{/assets/vendors/base/vendors.bundle.js}" type="text/javascript"></script>
<script th:src="@{/assets/demo/default/base/scripts.bundle.js}" type="text/javascript"></script>
<script src="https://code.jquery.com/jquery-3.3.1.js"></script>
<script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
<script th:src="@{/js/custom/sinhvien/svNhomDatn.js}" type="text/javascript"></script>
</body>
</html>
