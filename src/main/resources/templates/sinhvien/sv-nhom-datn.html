<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- begin::Head -->
<head>
    <meta charset="utf-8"/>
    <title>Xem chi tiết nhóm DATN | FCR FPT Polytechnic</title>
    <meta name="description" content="Static table examples">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <link th:href="@{/assets/vendors/base/vendors.bundle.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/demo/default/base/style.bundle.css}" rel="stylesheet" type="text/css"/>
    <link rel="shortcut icon" href="https://ap.poly.edu.vn/images/favicon.ico"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/plugin/query-ui.css}">
    <link th:href="@{/css/plugin/bootstrap.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/css/custom/button-icon.css}" rel="stylesheet" type="text/css"/>
    <style>
        body {
            overflow-x: hidden;
        }
    </style>
</head>
<!-- end::Head -->

<!-- begin::Body -->
<body class="m-page--fluid m--skin- m-content--skin-light2 m-header--fixed m-header--fixed-mobile m-aside-left--enabled m-aside-left--skin-dark m-aside-left--fixed m-aside-left--offcanvas m-footer--push m-aside--offcanvas-default">

<!-- begin:: Page -->
<div class="m-grid m-grid--hor m-grid--root m-page">

    <div th:insert="~{fragment/header-fragment :: header}"></div>

    <!-- begin::Body -->
    <div class="m-grid__item m-grid__item--fluid m-grid m-grid--ver-desktop m-grid--desktop m-body">

        <div th:insert="~{fragment/menu-fragment-sinh-vien :: menu}"></div>

        <!-- END: Left Aside -->
        <div class="m-grid__item m-grid__item--fluid m-wrapper">
            <!-- END: Subheader -->
            <div>
                <div class="m-content">
                    <h3>Nhóm dự án tốt nghiệp</h3>

                    <div class="mt-5">
                        <section class="fillter-area  mb-5">
                            <div class="m-portlet">
                                <div class="m-portlet__head">
                                    <div class="m-portlet__head-caption">
                                        <div class="m-portlet__head-title">
                                <span class="m-portlet__head-icon">
                                    <i class="m-menu__link-icon flaticon-web"></i>
                                </span>
                                            <h3 class="m-portlet__head-text">
                                                Thông tin
                                            </h3>
                                        </div>
                                    </div>
                                </div>
                                <form
                                        class="m-portlet__body">
                                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                                    <div class="form-group row">
                                        <label class="col-xl-3 col-lg-3 col-form-label">Mã
                                            nhóm</label>
                                        <div class="col-lg-9 col-xl-6">
                                            <input type="text"
                                                   th:value="${nhomDatnThamGia[0].maNhom}"
                                                   readonly="readonly" class="form-control">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-xl-3 col-lg-3 col-form-label">Tên
                                            nhóm</label>
                                        <div class="col-lg-9 col-xl-6">
                                            <input type="text"
                                                   id="detailTenNhom"
                                                   th:value="${nhomDatnThamGia[0].tenNhom} == null ? 'Chưa có' : ${nhomDatnThamGia[0].tenNhom}"
                                                   readonly="readonly" class="form-control">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-xl-3 col-lg-3 col-form-label">Tên đợt đăng
                                            ký</label>
                                        <div class="col-lg-9 col-xl-6">
                                            <input type="text"
                                                   th:value="${nhomDatnThamGia[0].tenDotDangKy}"
                                                   readonly="readonly" class="form-control">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-xl-3 col-lg-3 col-form-label">Tên đề
                                            tài</label>
                                        <div class="col-lg-9 col-xl-6">
                                            <input type="text"
                                                   id="detailTenDeTai"
                                                   th:value="${nhomDatnThamGia[0].tenDeTai} == null ? 'Chưa có' : ${nhomDatnThamGia[0].tenDeTai}"
                                                   readonly="readonly" class="form-control">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <span hidden="" th:text="${nhomDatnThamGia[0].getGvhdId()}"></span>
                                        <label class="col-xl-3 col-lg-3 col-form-label">Tên
                                            GVHD</label>
                                        <div class="col-lg-9 col-xl-6">
                                            <input type="text"
                                                   id="detailGvhd"
                                                   th:value="${nhomDatnThamGia[0].tenGvhd} == null ? '*Chưa có giảng viên hướng dẫn*' : ${nhomDatnThamGia[0].tenGvhd + ' - ' + nhomDatnThamGia[0].tenTaiKhoanGvhd}"
                                                   readonly="readonly" class="form-control">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-xl-3 col-lg-3 col-form-label">Tên môn dự án tốt nghiệp</label>
                                        <div class="col-lg-9 col-xl-6">
                                            <input type="text"
                                                   th:value="${nhomDatnThamGia[0].tenMonDatn}"
                                                   readonly="readonly" class="form-control">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-xl-3 col-lg-3 col-form-label">
                                            Mật khẩu
                                        </label>
                                        <div class="col-lg-9 col-xl-6">
                                            <input type="text"
                                                   th:value="${nhomDatnThamGia[0].getMatKhau()} == null ? 'Công khai' : ${nhomDatnThamGia[0].getMatKhau()}"
                                                   readonly="readonly" class="form-control">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-xl-3 col-lg-3 col-form-label">
                                            Nhận xét
                                        </label>
                                        <div class="col-lg-9 col-xl-6">
                                            <textarea
                                                    th:text="${nhomDatnThamGia[0].getNhanXet()}"
                                                    readonly="readonly" class="form-control">
                                            </textarea>
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-xl-3 col-lg-3 col-form-label">Trạng
                                            thái</label>
                                        <div class="col-lg-9 col-xl-6">
                                            <input type="text"
                                                   th:style="'color: #5867dd; font-weight: bold'"
                                                   th:value="${T(com.fpolydatn.util.TrangThaiNhomConverter).ConvertToTrangThai(nhomDatnThamGia[0].getTrangThai())}"
                                                   readonly="readonly" class="form-control">
                                        </div>
                                    </div>
                                    <div class="justify-content-center pt-2">
                                        <button th:style="${checkTruongNhom} == true ? '' : 'display: none'"
                                                type="button" class="btn btn-primary"
                                                th:attr="onclick=|openModalDoiTenNhom()|">
                                            Đổi tên nhóm
                                        </button>
                                        <button th:style="${checkMocThoiGian} == true
                                                    and ${nhomDatnThamGia[0].getTrangThai()} == 0
                                                    and ${checkTruongNhom} == true ? '' : 'display: none'"
                                                type="button" class="btn btn-primary"
                                                th:attr="onclick=|openModalDoiDeTai()|">
                                            Đổi tên đề tài
                                        </button>
                                        <button th:style="${checkMocThoiGian} == true
                                                    and ${nhomDatnThamGia[0].getTrangThai()} == 0
                                                    and ${checkTruongNhom} == true ? '' : 'display: none'"
                                                type="button" class="btn btn-primary"
                                                th:attr="onclick=|openModalChonGVHD()|">
                                            Chọn GVHG
                                        </button>
                                        <button data-toggle="tooltip"
                                                title="Export mẫu phiếu đăng ký DATN"
                                                type="button" class="btn btn-primary"
                                                th:style=" ${nhomDatnThamGia[0].getTrangThai()} == 5
                                                            and ${checkTruongNhom} == true ? '' : 'display: none'"
                                                th:attr="onclick=|exportWord()|">
                                            Export mẫu phiếu
                                        </button>
                                        <button data-bs-toggle="modal" data-bs-target="#history"
                                                type="button"
                                                th:attr="onclick=|openModalHistory(0, 20, '${nhomDatnThamGia[0].maNhom}')|"
                                                class="btn btn-success">
                                            Lịch sử
                                        </button>
                                        <div class="modal fade" id="history" tabindex="-1" aria-labelledby="historyLabel" aria-hidden="true">
                                            <div class="modal-dialog modal-lg">
                                                <div class="modal-content">
                                                    <div class="modal-header">
                                                        <h5 class="modal-title" id="historyLabel">Lịch sử</h5>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                    </div>
                                                    <div class="modal-body">
                                                        <div class="form-group">
                                                            <table
                                                                    style="text-align: center"
                                                                    class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                                                <thead>
                                                                <th class="text-center align-middle" width="50px">STT</th>
                                                                <th class="text-center align-middle">Ngày thực hiện</th>
                                                                <th class="text-center align-middle">Nội dung</th>
                                                                <th class="text-center align-middle">Chức Vụ</th>
                                                                </thead>
                                                                <tbody id="listHistory">

                                                                </tbody>
                                                            </table>

                                                            <div id="pageHistory">
                                                            </div>
                                                            <div id="emptyHistory">
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Đóng</button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
<!--                                        <button-->
<!--                                                th:attr="onclick=|openModalHistoryDownload()|"-->
<!--                                                class="btn btn-success">-->
<!--                                            Tải file log-->
<!--                                        </button>-->
                                    </div>
                                </form>
                            </div>
                        </section>

                        <div class="m-portlet">
                            <div class="m-portlet">
                                <div class="m-portlet__body">
                                    <h3>Danh sách thành viên nhóm</h3>
                                    <div class="modal-body">
                                        <div class="form-group">
                                            <table id="custom-table"
                                                   style="text-align: center"
                                                   class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                                <thead>
                                                <th class="text-center align-middle" width="50px">STT</th>
                                                <th class="text-center align-middle">Mã Sinh Viên</th>
                                                <th class="text-center align-middle">Tên Sinh Viên</th>
                                                <th class="text-center align-middle">Môn Theo Chương Trình</th>
                                                <th class="text-center align-middle">Chức Vụ</th>
                                                <th class="text-center align-middle" th:style="${checkMocThoiGian} == false or ${soThanhVien} == 1 ? 'display:none' :
                                                    (${checkTruongNhom} == false ? 'display:none' : 'display:block')">
                                                    Chức năng
                                                </th>
                                                </thead>
                                                <tbody>
                                                <th:block th:each="SvNhomDatn : ${nhomDatnThamGia}">
                                                    <tr th:style="${SvNhomDatn.getChucVu()} == 1 ? 'color: #5867dd; font-weight: bold' : ''" class="table-light">
                                                        <td class="text-center align-middle" th:text="${SvNhomDatn.getStt()}"></td>
                                                        <td class="text-center align-middle" th:text="${SvNhomDatn.getMaSinhVien()}"></td>
                                                        <td class="text-center align-middle" th:text="${SvNhomDatn.getTenSinhVien()}"></td>
                                                        <td class="text-center align-middle" th:text="${SvNhomDatn.getTenMonChuongTrinh()}"></td>
                                                        <td class="text-center align-middle" th:text="${SvNhomDatn.getChucVu()} == 1 ? 'Trưởng nhóm' : 'Thành viên'"></td>
                                                        <td class="text-center align-middle" th:style="${checkMocThoiGian} == false or ${soThanhVien} == 1 ? 'display:none' :
                                                            (${checkTruongNhom} == false ? 'display:none' :
                                                            (${SvNhomDatn.getChucVu()} == 1 ? 'display: none' : 'display: block'))">
                                                            <div class="d-flex justify-content-center align-items-center">
                                                                <button
                                                                        class="btn_change_role"
                                                                        data-toggle="tooltip"
                                                                        title="Chuyển quyền trưởng nhóm"
                                                                        th:attr="onclick=|chuyenQuyenTruongNhom('${SvNhomDatn.getIdSinhVien()}', '${SvNhomDatn.getTenSinhVien()}')|">
                                                                    <img th:src="@{/img/change-role.svg}">
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </th:block>
                                                </tbody>
                                            </table>
                                            <!-- Điều kiện khi chưa check thời điểm tham gia, tạo nhóm -->

                                            <!--                                            (${soThanhVien} == 1 ? 'display: block' :-->
                                            <!--                                            (${checkTruongNhom} == true ? 'display:none' : 'display:block'))"-->

                                                 (${checkThoiDiemJoinNhom} == false ? 'display: none' :
                                                 (${soThanhVien} == 1 ? 'display: block' :
                                                 (${checkTruongNhom} == true ? 'display:none' : 'display:block')))">

                                                <button class="btn btn-danger text-white"
                                                        th:attr="onclick=|confirmRoiNhom(${soThanhVien})|">
                                                    Rời nhóm
                                                </button>
                                            </div>
                                            <!-- Nút chưa validate -->
                                            <!--                                            <div-->

                                            <!--                                                        class="btn btn-danger text-white"-->
                                            <!--                                                        th:attr="onclick=|confirmRoiNhom(${soThanhVien})|">-->
                                            <!--                                                    Rời nhóm-->
                                            <!--                                                </button>-->
                                            <!--                                            </div>-->

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

<!--                        <div class="m-portlet">-->
<!--                            <div class="m-portlet">-->
<!--                                <div class="m-portlet__body">-->
<!--                                    <h3>Lịch sử nhóm</h3>-->

                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- end:: Body -->
</div>
<!--  Begin modal chọn giảng viên-->
<div class="modal fade " id="modal_chon_giang_vien" tabindex="-1"
     aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="form_chon_giang_vien">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">
                        Đăng ký nhóm Dự án tốt nghiệp</h5>
                    <button type="button" class="close"
                            data-bs-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label class="col-form-label">Chọn giảng viên hướng dẫn</label>
                        <select class="form-control col-12"
                                id="chonGiangVien">
                            <option th:each="giangVien : ${listGiangVien}"
                                    th:style="${giangVien.getId() == nhomDatnThamGia[0].getGvhdId() ? 'font-weight: bold;' : ''}"
                                    th:text="${giangVien.getId() == nhomDatnThamGia[0].getGvhdId() ?
                                    	giangVien.getTenGvhd + ' - ' + giangVien.getTenTaiKhoan() + ' (Đã chọn)'
                                    	: giangVien.getTenGvhd + ' - ' + giangVien.getTenTaiKhoan()}"
                                    th:selected="${giangVien.getId() == nhomDatnThamGia[0].getGvhdId()}"
                                    th:value="${giangVien.getId}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary btn btn-light"
                            data-bs-dismiss="modal">Hủy
                    </button>
                    <button type="button" class="btn btn-primary"
                            th:attr="onclick=|chonGiangVienHuongDan()|">
                        Đồng ý
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<!--                     End modal chọn giảng viên         -->
<!--                        begin Đổi tên đề tài           -->
<div
        class="modal fade"
        tabindex="-1"
        id="modal_doi_ten_de_Tai"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true">
    <div class="modal-dialog modal-lg modal-lg"
         role="document">
        <div class="modal-content">
            <form id="form_doi_ten_de_tai">
                <div class="modal-header">
                    <h5 class="modal-title">Đổi tên đề tài</h5>
                    <button type="button" class="close"
                            data-bs-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <br>
                        <label class="col-form-label">Tên đề tài</label>
                        <input
                                maxlength="255"
                                type="text"
                                class="form-control"
                                id="inputTenDeTai">
                        <span class="text-danger"
                              id="errorTenDeTai"></span><br>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary btn btn-light"
                            data-bs-dismiss="modal">Hủy
                    </button>
                    <button
                            type="button" class="btn btn-primary"
                            th:attr="onclick=|doiTenDeTai()|"
                    >Đổi tên đề tài
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<!--                        End đổi tên đề tài           -->
<!--                        Begin đổi tên nhóm           -->
<div
        class="modal fade"
        tabindex="-1"
        id="modal_doi_ten_nhom"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true">
    <div class="modal-dialog modal-lg modal-lg"
         role="document">
        <div class="modal-content">
            <form id="form_doi_ten_nhom">
                <div class="modal-header">
                    <h5 class="modal-title">Đổi tên nhóm</h5>
                    <button type="button" class="close"
                            data-bs-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <br>
                        <label class="col-form-label">Tên nhóm</label>
                        <input
                                type="text"
                                class="form-control"
                                maxlength="255"
                                id="inputTenNhom">
                        <span class="text-danger"
                              id="errorTenNhom"></span><br>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary btn btn-light"
                            data-bs-dismiss="modal">Hủy
                    </button>
                    <button type="button" class="btn btn-primary"
                            th:attr="onclick=|doiTenNhom()|">
                        Đổi tên nhóm
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<!--                        End đổi tên nhóm-->

<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.js}"></script>
