<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="form-action 'self' *">
  <title>Capstone Register</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body {
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
    }
    .header {
      background-color: #007bff;
      color: #ffffff;
      padding: 20px 0;
      text-align: center;
      margin-bottom: 20px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .role-cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .role-card {
      border-radius: 15px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      text-align: center;
      background-color: #ffffff;
      width: 250px;
      height: 250px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-icon {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #007bff;
    }
    h3 {
      margin-bottom: 10px;
      color: #007bff;
    }
    p {
      color: #495057;
      margin-bottom: 15px;
    }
    .btn-primary {
      background-color: #ffc107;
      border-color: #ffc107;
      color: #ffffff;
      width: 100%;
    }
    .btn-primary:hover {
      background-color: #ff9800;
      border-color: #ff9800;
    }
    .btn-container {
      margin-top: auto;
    }
    .logo {
      display: block;
      width: 150px;
      height: auto;
      margin: 0 auto 20px;
    }
    .select-campus {
      margin-bottom: 15px;
      width: 250px;
    }
    .dropdown-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      width: 100%;
      padding-left: 20px;
    }
    .dropdown-label {
      margin-right: 10px;
      color: #007bff;
      font-weight: bold;
    }
    .campus-section {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="/img/FPTPolytechic.png" alt="Capstone Register Logo" class="logo">
    <h1>ĐĂNG KÝ DỰ ÁN TỐT NGHIỆP</h1>
  </div>

  <div class="container">
    <form action="/authentication" method="POST">
      <div class="campus-section">
        <div class="dropdown-container">
          <label for="campusSelect" class="dropdown-label">Chọn cơ sở</label>
          <select id="campusSelect" name="campus" class="form-control select-campus">
            <th:block th:each="coSo,i : ${listCoSo}">
              <option th:value="${coSo.id}" th:text="${coSo.name}"></option>
            </th:block>
          </select>
        </div>
      </div>
      <div th:text="${session.messageError}" style="color:red"></div>
      <div class="role-cards">
        <div class="role-card text-center">
          <i class="fas fa-users card-icon"></i>
          <h3>Cán bộ <br/> Đào tạo</h3>
          <div class="btn-container">
            <button type="submit" class="btn btn-primary" name="role" value="dao-tao">Enter</button>
          </div>
        </div>
        
        <div class="role-card text-center">
          <i class="fas fa-user-graduate card-icon"></i>
          <h3>Sinh viên</h3>
          <div class="btn-container">
            <button type="submit" class="btn btn-primary" name="role" value="sinh-vien">Enter</button>
          </div>
        </div>
        
        <div class="role-card text-center">
          <i class="fas fa-chalkboard-teacher card-icon"></i>
          <h3>Giảng viên <br/> hướng dẫn</h3>
          <div class="btn-container">
            <button type="submit" class="btn btn-primary" name="role" value="giang-vien">Enter</button>
          </div>
        </div>
        
        <div class="role-card text-center">
          <i class="fas fa-user-tie card-icon"></i>
          <h3>Chủ nhiệm <br/> Bộ môn</h3>
          <div class="btn-container">
            <button type="submit" class="btn btn-primary" name="role" value="chu-nhiem">Enter</button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <script th:src="@{/jquery/jquery.min.js}"></script>
  <script th:src="@{/jquery/popper.min.js}"></script>
  <script th:src="@{/jquery/bootstrap.min.js}"></script>
</body>
</html>
