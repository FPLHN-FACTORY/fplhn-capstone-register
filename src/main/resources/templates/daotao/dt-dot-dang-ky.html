<!DOCTYPE html>
<html lang="en">
<!-- begin::Head -->
<head>
    <meta charset="utf-8"/>
    <title>Project Register System</title>
    <meta name="description" content="Static table examples">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <link th:href="@{/assets/vendors/base/vendors.bundle.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/demo/default/base/style.bundle.css}" rel="stylesheet" type="text/css"/>
    <link rel="shortcut icon" href="https://ap.poly.edu.vn/images/favicon.ico"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/plugin/query-ui.css}">
</head>
<!-- end::Head -->

<!-- begin::Body -->
<body class="m-page--fluid m--skin- m-content--skin-light2 m-header--fixed m-header--fixed-mobile m-aside-left--enabled m-aside-left--skin-dark m-aside-left--fixed m-aside-left--offcanvas m-footer--push m-aside--offcanvas-default">

<!-- begin:: Page -->
<div class="m-grid m-grid--hor m-grid--root m-page">

    <div th:insert="~{fragment/header-fragment :: header}"></div>

    <!-- begin::Body -->
    <div class="m-grid__item m-grid__item--fluid m-grid m-grid--ver-desktop m-grid--desktop m-body">

        <div th:insert="~{fragment/menu-fragment-daotao :: menu}"></div>

        <!-- END: Left Aside -->
        <div class="m-grid__item m-grid__item--fluid m-wrapper">
            <!-- END: Subheader -->
            <div>
                <div class="m-content">
                    <h3>Quản lý đợt đăng ký</h3>
                    <div class="mt-5">
                        <div class="m-portlet">
                            <div class="m-portlet">
                                <div class="m-portlet__body">
                                    <div class="row">
                                        <div class="col-6 d-inline">
                                            <button
                                                    data-toggle="modal"
                                                    data-target="#modal_create"
                                                    class="col-12 col-sm-8 col-md-4 btn btn-success"
                                                    onclick="clearData()">
                                                Tạo đợt đăng ký
                                            </button>
                                            <!--Start Model Create-->
                                            <div class="modal fade "
                                                 id="modal_create"
                                                 tabindex="-1"
                                                 aria-labelledby="exampleModalLabel"
                                                 aria-hidden="true">
                                                <div class="modal-dialog modal-lg">
                                                    <div class="modal-content">
                                                        <form id="form_create_dot_dang_ky">
                                                            <div class="modal-header">
                                                                <h5 class="modal-title" id="exampleModalLabel">Thêm đợt đăng ký</h5>
                                                                <button type="button" class="close" data-dismiss="modal"
                                                                        aria-label="Close">
                                                                    <span aria-hidden="true">x</span>
                                                                </button>
                                                            </div>
                                                            <div class="modal-body">
                                                                <div class="form-group">
                                                                    <label class="col-form-label">Tên đợt</label>
                                                                    <input
                                                                            type="text"
                                                                            class="form-control"
                                                                            id="tenDotDangKyAdd">
                                                                    <span class="text-danger"
                                                                          id="errorMessageAddTenDot"></span>
                                                                    <br>
                                                                    <label class="col-form-label">Ngày bắt đầu</label>
                                                                    <input
                                                                            type="datetime-local"
                                                                            class="form-control"
                                                                            id="ngayBatDauAdd">
                                                                    <span class="text-danger"
                                                                          id="errorMessageAddNgayBatDau"></span>
                                                                    <br>
                                                                    <label class="col-form-label">Ngày kết thúc</label>
                                                                    <input
                                                                            type="datetime-local"
                                                                            class="form-control"
                                                                            id="ngayKetThucAdd">
                                                                    <span class="text-danger"
                                                                          id="errorMessageAddNgayKetThuc"></span>
                                                                    <br>
                                                                </div>
                                                            </div>
                                                            <div class="modal-footer">
                                                                <button type="button" class="btn btn-secondary"
                                                                        data-dismiss="modal">Hủy
                                                                </button>
                                                                <button type="submit" class="btn btn-primary">Thêm mới
                                                                </button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                            <!--End Model Create-->
                                        </div>
                                    </div>
                                    <!--Start View Table-->
                                    <div class="table-responsive mt-3">
                                        <table id="custom-table"
                                               class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                            <thead>
                                            <th>STT</th>
                                            <th>Tên học kỳ</th>
                                            <th>Tên đợt</th>
                                            <th>Ngày bắt đầu</th>
                                            <th>Ngày kết thúc</th>
                                            <th>Tổng số SV đăng ký</th>
                                            <th>Tổng số SV đã có nhóm</th>
                                            <th>Trạng thái</th>
                                            <th>Chức năng</th>
                                            </thead>
                                            <tbody>
                                            <th:block th:each="dotDangKy, i: ${page.data}">
                                                <tr>
                                                    <td th:text="${dotDangKy.getSTT()}"></td>
                                                    <td th:text="${dotDangKy.getTenHocKy()}"></td>
                                                    <td th:text="${dotDangKy.getTenDotDangKy()}"></td>
                                                    <td th:text="${#dates.format(dotDangKy.getNgayBatDau(), 'dd-MM-yyyy HH:mm')}"></td>
                                                    <td th:text="${#dates.format(dotDangKy.getNgayKetThuc(), 'dd-MM-yyyy HH:mm')}"></td>
                                                    <td th:text="${dotDangKy.getTongSinhVien()}"></td>
                                                    <td th:text="${dotDangKy.getTongSinhVienCoNhom()}"></td>
                                                    <td th:text="${dotDangKy.getTrangThai()} == 1 ? 'Mở' : 'Đóng'" style="color: #5867dd; font-weight: bold"></td>
                                                    <td>
                                                        </button>
                                                        <button
                                                                type="button"
                                                                class="btn btn-danger"
                                                                data-toggle="modal"
                                                                th:attr="onclick=|openModalUpdateDotDangKy('${dotDangKy.getId()}')|">
                                                            Sửa
                                                        </button>
                                                    </td>
                                                </tr>
                                            </th:block>
                                            </tbody>
                                        </table>
                                        <!-- Paging-->
                                        <nav th:if="${page.totalPages > 1}" aria-label="Page navigation ">
                                            <ul class="pagination justify-content-end">
                                                <div th:each="i:${#numbers.sequence( 1, page.totalPages, 1)}">
                                                    <li class="page-item">
                                                        <a class="page-link"
                                                           th:href="@{/dao-tao/dot-dang-ky?page={page.currentPage}(page.currentPage=${i}-1)}"
                                                           th:text="${i}">
                                                        </a>
                                                    </li>
                                                </div>
                                            </ul>
                                        </nav>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- end:: Body -->
</div>
<!--  Start Modal Update-->
<div
        class="modal fade"
        tabindex="-1"
        id="modal_update_dot_dang_ky"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true">
    <div class="modal-dialog modal-lg modal-lg"
         role="document">
        <div class="modal-content">
            <form id="form_dot_dang_ky_update">
                <div class="modal-header">
                    <h5 class="modal-title">Cập nhật đợt đăng ký</h5>
                    <button type="button" class="close"
                            data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <span id="id_dot_dang_ky_update" style="color:red;"></span>
                    <span id="id_hoc_ky_update" style="color:red;"></span>
                    <span id="id_co_so_update" style="color:red;"></span>
                    <div class="form-group">
                        <label class="col-form-label">Tên đợt</label>
                        <input
                                type="text"
                                class="form-control"
                                id="ten_dot_dang_ky_update"/>
                        <label class="col-form-label">Ngày bắt đầu</label>
                        <input
                                type="datetime-local"
                                class="form-control"
                                id="ngay_bat_dau_update"/>
                        <label class="col-form-label">Ngày kết thúc</label>
                        <input
                                type="datetime-local"
                                class="form-control"
                                id="ngay_ket_thuc_update"/>
                        <small class="text-danger"
                               id="errorMessageUpdate"></small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-dismiss="modal">Hủy
                    </button>
                    <button type="submit" class="btn btn-primary">Cập
                        nhật
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<!--   End Modal Update -->
<script th:src="@{/assets/vendors/base/vendors.bundle.js}" type="text/javascript"></script>
<script th:src="@{/assets/demo/default/base/scripts.bundle.js}" type="text/javascript"></script>
<script src="https://code.jquery.com/jquery-3.3.1.js"></script>
<script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
<script th:src="@{/js/custom/daotao/DtDotDangKy.js}" type="text/javascript"></script>
</body>
</html>
