<!DOCTYPE html>
<html lang="en">
<!-- begin::Head -->
<head>
    <meta charset="utf-8"/>
    <title>Project Register System</title>
    <meta name="description" content="Static table examples">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <link th:href="@{/assets/vendors/base/vendors.bundle.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/demo/default/base/style.bundle.css}" rel="stylesheet" type="text/css"/>
    <link rel="shortcut icon" href="https://ap.poly.edu.vn/images/favicon.ico"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/plugin/query-ui.css}">
</head>
<!-- end::Head -->

<!-- begin::Body -->
<body class="m-page--fluid m--skin- m-content--skin-light2 m-header--fixed m-header--fixed-mobile m-aside-left--enabled m-aside-left--skin-dark m-aside-left--fixed m-aside-left--offcanvas m-footer--push m-aside--offcanvas-default">

<!-- begin:: Page -->
<div class="m-grid m-grid--hor m-grid--root m-page">

    <div th:insert="~{fragment/header-fragment :: header}"></div>

    <!-- begin::Body -->
    <div class="m-grid__item m-grid__item--fluid m-grid m-grid--ver-desktop m-grid--desktop m-body">

        <div th:insert="~{fragment/menu-fragment :: menu}"></div>

        <!-- END: Left Aside -->
        <div class="m-grid__item m-grid__item--fluid m-wrapper">
            <!-- END: Subheader -->
            <div>
                <div class="m-content">
                    <h3>Xem danh sách nhóm dự án tốt nghiệp theo đợt</h3>
                    <div class="mt-5">
                        <section class="fillter-area  mb-5">
                            <div class="m-portlet">
                                <div class="m-portlet__head">
                                    <div class="m-portlet__head-caption">
                                        <div class="m-portlet__head-title">
                                <span class="m-portlet__head-icon">
                                    <i class="m-menu__link-icon flaticon-web"></i>
                                </span>
                                            <h3 class="m-portlet__head-text">
                                                Bộ lọc
                                            </h3>
                                        </div>
                                    </div>
                                </div>
                                <form  id="form_search"
                                       th:action="@{/dao-tao/nhom-datn}"
                                       method="GET"
                                       class="m-portlet__body">
                                    <div class="row">
                                        <div
                                                class="form-group d-inline col-md-6 col-10 d-flex justify-content-around align-items-center">
                                            <span for="" class="fillter-name col-5 text-center">Tìm tên</span>
                                            <input type="text" class="form-control col-6" name="keyword" id="keyword"
                                            >
                                        </div>
                                        <div
                                                class="form-group d-inline col-md-6 col-10 d-flex justify-content-around align-items-center">
                                            <span for="" class="fillter-name col-5 text-center">Chuyên ngành</span>
                                            <select name="chuyenNganh" id="chuyenNganh" class="form-control col-6">
                                                <option value="">chọn chuyên ngành</option>
                                                <option th:each="chuyenhNganh : ${listChuyenNganh}"
                                                        th:value="${chuyenhNganh.getId}"
                                                        th:text="${chuyenhNganh.getName}">
                                                </option>
                                            </select>
                                        </div>
                                        <div
                                                class="form-group d-inline col-md-6 col-10 d-flex justify-content-around align-items-center">
                                            <span for="" class="fillter-name col-5 text-center">Trạng thái</span>
                                            <select name="trangThai" id="trangThai" class="form-control col-6">
                                                <option value="">chọn trạng thái</option>
                                                <option value="a">Đã có nhóm
                                                </option>
                                                <option value="b">Chưa có nhóm
                                                </option>
                                            </select>
                                        </div>
                                        <div
                                                class="form-group d-inline col-md-6 col-10 d-flex justify-content-around align-items-center">
                                            <span for="" class="fillter-name col-5 text-center">Đợt đăng ký</span>
                                            <select name="dotDangKy" id="dotDangKy" class="form-control col-6">
                                                <option value="">chọn đợt đăng ký</option>
                                                <option th:each="dotDangKy : ${listDotDangKy}"
                                                        th:value="${dotDangKy.getId}"
                                                        th:text="${dotDangKy.getName}">
                                                </option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="row justify-content-center pt-2">
                                        <div class="col-sm-2 col-12 text-center mt-2">
                                            <a type="submit" class="btn btn-primary text-white" onclick="loadDataNhomDatn(0)">Tìm
                                                kiếm</a>
                                        </div>
                                        <div class="col-sm-2 col-12 text-center mt-2">
                                            <a href="#"
                                               class="btn btn-danger text-white" onclick="clearform();">
                                                Làm mới bộ lọc
                                            </a>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </section>
                        <div class="m-portlet">
                            <div class="m-portlet">
                                <div class="m-portlet__body">
<!--                                    hiển thị danh sách chi tiết-->
                                    <div class="row">
                                        <div class="col-6 d-inline"
                                        >
                                            <div class="modal fade "
                                                 id="modal_create"
                                                 tabindex="-1"
                                                 aria-labelledby="exampleModalLabel"
                                                 aria-hidden="true">
                                                <div class="modal-dialog modal-lg">
                                                    <div class="modal-content">
                                                        <form id="form_create_hoc_ky">
                                                            <div class="modal-body">
                                                                <div class="form-group">
                                                                    <label class="col-form-label">Danh sách thành viên
                                                                        nhóm</label>
                                                                    <hr>
                                                                    <table id="custom-table"
                                                                           class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                                                        <!-- hear-->
                                                                        <thead>
                                                                        <th>Mã sinh viên</th>
                                                                        <th>Tên sinh viên</th>
                                                                        </thead>
                                                                        <!-- body-->
                                                                        <tbody id="show_Dssv">

                                                                        </tbody>
                                                                    </table>
                                                                </div>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
<!--                                    begin-->
                                    <div class="table-responsive mt-3">
                                        <table id="custom-table"
                                               class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                            <thead>
                                            <th width="50px">STT</th>
                                            <th>Tên nhóm</th>
                                            <th>Tên đề tài</th>
                                            <th>Chuyên nghành</th>
                                            <th>Số thành viên</th>
                                            <th>Trưởng nhóm</th>
                                            <th>Gv hướng dẫn</th>
                                            <th>Trạng thái</th>
                                            <th>Danh sách thành viên</th>
                                            </thead>
                                            <tbody id="listNhomDatn">
                                            <th:block th:each="nhomDatn : ${page.data}">
                                                <tr>
                                                    <td th:text="${nhomDatn.getStt()}"></td>
                                                    <td th:text="${nhomDatn.tenNhom}"></td>
                                                    <td th:text="${nhomDatn.tenDeTai}"></td>
                                                    <td th:text="${nhomDatn.tenChuyenNganh}"></td>
                                                    <td th:text="${nhomDatn.countSinhVien}"></td>
                                                    <td th:text="${nhomDatn.maSinhVien}"></td>
                                                    <td th:text="${nhomDatn.tenGvhd}"></td>
                                                    <td th:text="${nhomDatn.getTrangThai()}==0?'Chưa chốt đề tài':(${nhomDatn.getTrangThai()}==1?'Giáo viên đã chốt':'CNBM đã chốt')"></td>
                                                    <td>
                                                        <div class="row">
                                                            <div class="col-6 d-inline"
                                                            >
                                                                <button
                                                                        data-toggle="modal"
                                                                        data-target="#modal_create"
                                                                        class=" btn btn-success"
                                                                        th:attr="onclick=|openModalDanhSachSinhVien('${nhomDatn.getId()}')|"
                                                                >
                                                                    Xem chi tiết
                                                                </button>
                                                                <div class="modal fade"></div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </th:block>
                                            </tbody>
                                        </table>

                                        <!-- Paging-->
                                        <nav th:if="${page.totalPages > 1}" aria-label="Page navigation">
                                            <ul class="pagination justify-content-end" id="list_page">
                                                <div th:each="i:${#numbers.sequence( 1, page.totalPages, 1)}">
                                                    <li class="page-item">
                                                        <a class="page-link"
                                                           th:href="@{/dao-tao/nhom-datn?page={page.currentPage}(page.currentPage=${i}-1)}"
                                                           th:text="${i}">
                                                        </a>
                                                    </li>
                                                </div>
                                            </ul>
                                        </nav>
                                    </div>
                                    <div id="empty">
                                        <div th:if="${page.data.isEmpty()}">
                                            <h3>Không có dữ liệu</h3>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- end:: Body -->
</div>

<script th:src="@{/assets/vendors/base/vendors.bundle.js}" type="text/javascript"></script>
<script th:src="@{/assets/demo/default/base/scripts.bundle.js}" type="text/javascript"></script>
<script src="https://code.jquery.com/jquery-3.3.1.js"></script>
<script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
<script th:src="@{/js/custom/daotao/nhomDatnTheoDot.js}" type="text/javascript"></script>
</body>
</html>
