<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- begin::Head -->
<head>
    <meta charset="utf-8"/>
    <title>Project Register System</title>
    <meta name="description" content="Static table examples">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <link th:href="@{/assets/vendors/base/vendors.bundle.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/demo/default/base/style.bundle.css}" rel="stylesheet" type="text/css"/>
    <link rel="shortcut icon" href="https://ap.poly.edu.vn/images/favicon.ico"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/plugin/query-ui.css}">
</head>
<!-- end::Head -->

<!-- begin::Body -->
<body class="m-page--fluid m--skin- m-content--skin-light2 m-header--fixed m-header--fixed-mobile m-aside-left--enabled m-aside-left--skin-dark m-aside-left--fixed m-aside-left--offcanvas m-footer--push m-aside--offcanvas-default">

<!-- begin:: Page -->
<div class="m-grid m-grid--hor m-grid--root m-page">

    <div th:insert="~{fragment/header-fragment :: header}"></div>

    <!-- begin::Body -->
    <div class="m-grid__item m-grid__item--fluid m-grid m-grid--ver-desktop m-grid--desktop m-body">

        <div th:insert="~{fragment/menu-fragment :: menu}"></div>

        <!-- END: Left Aside -->
        <div class="m-grid__item m-grid__item--fluid m-wrapper">
            <!-- END: Subheader -->
            <div>
                <div class="m-content">
                    <h3>Quản lý học kỳ</h3>
                    <div class="mt-5">
                        <section class="fillter-area  mb-5">
                            <div class="m-portlet">
                                <div class="m-portlet__head">
                                    <div class="m-portlet__head-caption">
                                        <div class="m-portlet__head-title">
                                <span class="m-portlet__head-icon">
                                    <i class="m-menu__link-icon flaticon-web"></i>
                                </span>
                                            <h3 class="m-portlet__head-text">
                                                Bộ lọc
                                            </h3>
                                        </div>
                                    </div>
                                </div>
                                <form
                                       id="searchGvhd"
                                        method="GET"
                                        class="m-portlet__body">
                                    <div class="row">
                                        <div
                                                class="form-group d-inline col-md-6 col-12 d-flex justify-content-around align-items-center">
                                            <span for="" class="fillter-name col-4 text-center">Tên học kỳ</span>
                                            <input type="text" class="form-control col-8"
                                                   name="tenHocKy" id="ten-hoc-ky" value="">
                                        </div>
                                    </div>

                                    <div class="row justify-content-center pt-2">
                                        <div class="col-sm-2 col-12 text-center mt-2">
                                            <button type="submit" class="btn btn-primary">Tìm kiếm</button>
                                        </div>
                                        <div class="col-sm-2 col-12 text-center mt-2">
                                            <a href="#"
                                               class="btn btn-danger text-white" onclick="clearData();">
                                                Làm mới bộ lọc
                                            </a>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </section>

                        <div class="m-portlet">
                            <div class="m-portlet">
                                <div class="m-portlet__body">
                                    <div class="row">
                                        <div class="col-6 d-inline">
                                            <button data-toggle="modal"
                                                    data-target="#modal_create"
                                                    class="col-12 col-sm-8 col-md-4 btn btn-success">
                                                Thêm giảng viên
                                            </button>
                                            <div class="modal fade "
                                                 id="modal_create"
                                                 tabindex="-1"
                                                 aria-labelledby="exampleModalLabel"
                                                 aria-hidden="true">
                                                <div class="modal-dialog modal-lg">
                                                    <div class="modal-content">
                                                        <form id="form_create_giang_vien">
                                                            <div class="modal-header">
                                                                <h5 class="modal-title" id="exampleModalLabel">Thêm giảng viên</h5>
                                                                <button type="button" class="close" data-dismiss="modal"
                                                                        aria-label="Close">
                                                                    <span aria-hidden="true">&times;</span>
                                                                </button>
                                                            </div>
                                                            <div class="modal-body">
                                                                <div class="form-group">
<!--                                                                     combox dang ky-->


                                                                    <label class="col-form-label">Tên giảng viên</label>
                                                                    <input
                                                                            type="text"
                                                                            class="form-control"
                                                                            id="tenGvhd">
                                                                    <label class="col-form-label">Số nhóm hướng dẫn</label>
                                                                    <input
                                                                            type="text"
                                                                            class="form-control"
                                                                            id="soNhomHuongDanToiDa">
                                                                    <label class="col-form-label">Tên tài khoản</label>
                                                                    <input
                                                                            type="text"
                                                                            class="form-control"
                                                                            id="tenTaiKhoan">
                                                                    <label class="col-form-label">Số điện thoai</label>
                                                                    <input
                                                                            type="text"
                                                                            class="form-control"
                                                                            id="soDienThoai">
                                                                    <label class="col-form-label">Email Fpt</label>
                                                                    <input
                                                                            type="text"
                                                                            class="form-control"
                                                                            id="emailFpt">
                                                                    <label class="col-form-label">Email Fe</label>
                                                                    <input
                                                                            type="text"
                                                                            class="form-control"
                                                                            id="emailFe">
                                                                    <span class="text-danger"
                                                                          id="giang_vien_error"></span>
                                                                </div>
                                                            </div>
                                                            <div class="modal-footer">
                                                                <button type="button" class="btn btn-secondary"
                                                                        data-dismiss="modal">Hủy
                                                                </button>
                                                                <button type="submit" class="btn btn-primary">Thêm mới
                                                                </button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="table-responsive mt-3">
                                        <div th:unless="${page.data.isEmpty()}">
                                            <table id="custom-table"
                                                   class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                                <thead>
                                                <th width="50px">STT</th>
                                                <th>Tên Hoc Kỳ</th>
                                                <th width="200px">Chức năng</th>
                                                </thead>
                                                <tbody id="searchListGvhd" >
                                                <th:block th:each="giangVienHD,i : ${page.data}">
                                                    <tr>
                                                        <td th:text="${giangVienHD.getSTT()}"></td>
                                                        <td th:text="${giangVienHD.getTenCoSo()}"></td>
                                                        <td th:text="${giangVienHD.getTenDotDangKy()}"></td>
                                                        <td th:text="${giangVienHD.getTenGvhd()}"></td>
                                                        <td th:text="${giangVienHD.getTenTaiKhoan()}"></td>
                                                        <td th:text="${giangVienHD.getSoNhomHuongDanToiDa()}"></td>
                                                        <td th:text="${giangVienHD.getSoDienThoai()}"></td>
                                                        <td th:text="${giangVienHD.getEmailFpt()}"></td>
                                                        <td th:text="${giangVienHD.getEmailFe()}"></td>
                                                        <td>
                                                            <button
                                                                    type="button"
                                                                    class="btn btn-primary"
                                                                    th:attr="onclick=|openModalUpdateHocKy('${giangVienHD.id}')|">
                                                                Sửa
                                                            </button>
                                                            </button>
                                                            <button
                                                                    type="button"
                                                                    class="btn btn-danger"
                                                                    data-toggle="modal"
                                                                    th:attr="onclick=|openModalRemoveHocKy('${giangVienHD.id}')|">
                                                                Xoá
                                                            </button>
                                                        </td>
                                                    </tr>
                                                </th:block>
                                                </tbody>
                                            </table>
                                            <!-- Paging-->
                                            <nav th:if="${page.totalPages > 1}" aria-label="Page navigation">
                                                <ul class="pagination justify-content-end">
                                                    <div th:each="i:${#numbers.sequence( 1, page.totalPages, 1)}">
                                                        <li class="page-item">
                                                            <a class="page-link"
                                                               th:href="@{/admin/hoc-ky?page={page.currentPage}(page.currentPage=${i}-1)}"
                                                               th:text="${i}">
                                                            </a>
                                                        </li>
                                                    </div>
                                                </ul>
                                            </nav>
                                        </div>
                                        <div th:if="${page.data.isEmpty()}">
                                            <h3>Không có dữ liệu</h3>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- end:: Body -->
</div>
<!--  Start Modal Update-->
<div
        class="modal fade"
        tabindex="-1"
        id="modal_update_giang_vien"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true">
    <div class="modal-dialog modal-lg modal-lg"
         role="document">
        <div class="modal-content">
            <form id="form_giang_vien_update">
                <div class="modal-header">
                    <h5 class="modal-title">Cập nhật học kỳ</h5>
                    <button type="button" class="close"
                            data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <span id="giangVienId" style="color:red;"></span>

                    <div class="form-group">
                        <label class="col-form-label">Đợt đăng ký</label> <br>
                        <select class="form-control col-8"  id="dot_dang_ky_update">
                            <option  value="" hidden >Chọn đợt đăng kí</option>
                            <option th:each="item : ${listDotDangKy}" th:value="${item.id}" th:text="${item.tenDotDangKy}" ></option>
                        </select> <br>
                        <label class="col-form-label">Tên giảng viên</label>
                        <input
                                type="text"
                                class="form-control"
                                id="ten_giang_vien_update">
                        <label class="col-form-label">Số nhóm hướng dẫn</label>
                        <input
                                type="text"
                                class="form-control"
                                id="so_nhom_update">
                        <label class="col-form-label">Tên tài khoản</label>
                        <input
                                type="text"
                                class="form-control"
                                id="ten_tai_khoan_update">
                        <label class="col-form-label">Số điện thoai</label>
                        <input
                                type="text"
                                class="form-control"
                                id="so_dien_thoai_update">
                        <label class="col-form-label">EmailFpt</label>
                        <input
                                type="text"
                                class="form-control"
                                id="emailFpt_update">
                        <label class="col-form-label">EmailFe</label>
                        <input
                                type="text"
                                class="form-control"
                                id="emailFe_update">
                        <small class="text-danger"
                               id="errorMessageUpdate"></small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-dismiss="modal">Hủy
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Cập nhật
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<!--   End Modal Update -->

<!--  Start Modal Remove-->
<div
        class="modal fade"
        id="modal_giang_vien_remove"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true">
    <div class="modal-dialog modal-lg modal-lg"
         role="document">
        <div class="modal-content">
            <form id="form_hoc_ky_delete">
                <div class="modal-header">
                    <h5 class="modal-title">Xoá học kỳ</h5>
                    <button type="button" class="close"
                            data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>Bạn có muốn xoá không ?</p>
                    <span id="remove_giang_vien" style="color:red;"></span>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-dismiss="modal">Hủy
                    </button>
                    <button type="submit" class="btn btn-primary">Xoá
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<!--   End Modal Remove -->
<script th:src="@{/assets/vendors/base/vendors.bundle.js}" type="text/javascript"></script>
<script th:src="@{/assets/demo/default/base/scripts.bundle.js}" type="text/javascript"></script>
<script src="https://code.jquery.com/jquery-3.3.1.js"></script>
<script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
<script th:src="@{/js/custom/giangVien.js}" type="text/javascript"></script>
</body>
</html>
