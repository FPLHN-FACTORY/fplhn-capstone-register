<!DOCTYPE html>
<html lang="en">
<!-- begin::Head -->
<head>
    <meta charset="utf-8"/>
    <title>Project Register System</title>
    <meta name="description" content="Static table examples">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <link th:href="@{/assets/vendors/base/vendors.bundle.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/demo/default/base/style.bundle.css}" rel="stylesheet" type="text/css"/>
    <link rel="shortcut icon" href="https://ap.poly.edu.vn/images/favicon.ico"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/plugin/query-ui.css}">
    <style>
        .btn-export {
            color: #fff !important;
            background-color: #6c757d !important;
            border-color: #6c757d !important;
        }
        .btn-export:hover, .btn-import:hover {
            background-color: #51585e !important;
        }
        .btn-import {
            width: 40px;
            background-color: #6c757d !important;
        }
    </style>
</head>
<body class="m-page--fluid m--skin- m-content--skin-light2 m-header--fixed m-header--fixed-mobile m-aside-left--enabled m-aside-left--skin-dark m-aside-left--fixed m-aside-left--offcanvas m-footer--push m-aside--offcanvas-default">

    <!-- begin:: Page -->
    <div class="m-grid m-grid--hor m-grid--root m-page">
    
        <div th:insert="~{fragment/header-fragment :: header}"></div>
    
        <!-- begin::Body -->
        <div class="m-grid__item m-grid__item--fluid m-grid m-grid--ver-desktop m-grid--desktop m-body">
    
            <div th:insert="~{fragment/menu-fragment :: menu}"></div>
    
            <!-- END: Left Aside -->
            <div class="m-grid__item m-grid__item--fluid m-wrapper">
                <!-- END: Subheader -->
                <div>
                    <div>
                        <h3>Phân công hướng dẫn</h3>
                        <div class="m-content"  style="margin: 50px 0 0 50px ; background-color: #fff; width: 1200px;">
                            
                            <div id="main">
                                <div class="kt-grid__item kt-grid__item--fluid kt-app__content">
                                <div class="row">
                                    <div class="col-xl-12">
                                        <div class="kt-portlet">
                                            <div class="kt-portlet__head">
                                                <div class="kt-portlet__head-label">
                                                    <h3 class="kt-portlet__head-title">Thông tin Môn Dự Án Tốt Nghiệm</h3>
                                                </div>
                                            </div> 
                                            <form class="kt-form kt-form--label-right">
                                                <div class="kt-portlet__body">
                                                    <div class="kt-section kt-section--first">
                                                        <div class="kt-section__body"><div class="row">
                                                            <label class="col-xl-3"></label> 
                                                            <div class="col-lg-9 col-xl-6">
                                                                <h3 class="kt-section__title kt-section__title-sm" style="margin: 20px 0 ;">Thông tin môn</h3>
                                                            </div>
                                                        </div>
                                                        <div class="form-group row">
                                                            <label class="col-xl-3 col-lg-3 col-form-label">Mã môn</label> 
                                                            <div class="col-lg-9 col-xl-6">
                                                                <input type="text" th:value="${monDatn.maMon}" readonly="readonly" class="form-control">
                                                            </div>
                                                        </div> 
                                                        <div class="form-group row">
                                                            <label class="col-xl-3 col-lg-3 col-form-label">Tên môn</label> 
                                                            <div class="col-lg-9 col-xl-6">
                                                                <input type="text" th:value="${monDatn.tenMonDatn}" readonly="readonly" class="form-control">
                                                            </div>
                                                        </div> 
                                                        <div class="form-group row">
                                                            <label class="col-xl-3 col-lg-3 col-form-label">Chuyên ngành</label>
                                                            <div class="col-lg-9 col-xl-6">
                                                                <input type="text" th:value="${monDatn.tenChuyenNganh}" readonly="readonly" class="form-control">
                                                            </div>
                                                        </div> 
                                                        <div class="form-group row">
                                                            <label class="col-xl-3 col-lg-3 col-form-label">Cơ sở</label> 
                                                            <div class="col-lg-9 col-xl-6">
                                                                <input type="text" th:value="${monDatn.tenCoSo}" readonly="readonly" class="form-control">
                                                            </div>
                                                        </div> 
                                                        </div>
                                                    </div>
                                                </div>
                                            </form>
                                            <div class="kt-section__body"><div class="row">
                                                <label class="col-xl-3"></label> 
                                                <div class="col-lg-9 col-xl-6">
                                                    <h3 class="kt-section__title kt-section__title-sm" style="margin: 20px 0 ;">Danh sách giảng viên hướng dẫn</h3>
                                                </div>
                                            </div>
                                            <div class="table-responsive mt-3" style="overflow: hidden;">
                                                <div class="row" style="padding: 20px 0 ;">
                                                    
                                                    <div class="col-sm-6 text-left" style="padding: 0 ;">
                                                        <div class="col-6 d-inline">
                                                            <button data-toggle="modal" data-target="#modal_create" class="col-12 col-sm-8 col-md-4 btn btn-success">
                                                                Thêm giảng viên
                                                            </button>
                                                            
                                                        </div>
                                                    </div>
                                                    <div class="col-sm-6 text-right">
                                                        <div class="dt-buttons btn-group">
                                                            <a th:href="@{#}" class="btn btn-export buttons-print buttons-html5" tabindex="0" aria-controls="DataTables_Table_0" type="button">
                                                                <span>Print</span>
                                                            </a>
                                                            <a th:href="@{#}" class="btn btn-export buttons-copy buttons-html5" tabindex="0" aria-controls="DataTables_Table_0" type="button">
                                                                <span>Copy</span>
                                                            </a>
                                                            <a th:href="@{#}" class="btn btn-export buttons-excel buttons-html5" tabindex="0" aria-controls="DataTables_Table_0" type="button">
                                                                <span>Excel</span>
                                                            </a>
                                                            <a th:href="@{#}" class="btn btn-export buttons-csv buttons-html5" tabindex="0" aria-controls="DataTables_Table_0" type="button">
                                                                <span>CSV</span>
                                                            </a>
                                                            <a th:href="@{#}" class="btn btn-export buttons-pdf buttons-html5" tabindex="0" aria-controls="DataTables_Table_0" type="button">
                                                                <span>PDF</span>
                                                            </a>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="table-responsive mt-3">
                                                    <div th:unless="${page.data.isEmpty()}">
                                                        <table id="custom-table"
                                                               class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                                            <thead>
                                                            <th width="50px">STT</th>
                                                            <th>Tên Hoc Kỳ</th>
                                                            <th width="200px">Chức năng</th>
                                                            </thead>
                                                            <tbody>
                                                            <th:block th:each="phanCongHuongDan,i : ${page.data}">
                                                                <tr>
                                                                    <td th:text="${i.count}"></td>
                                                                    <td th:text="${phanCongHuongDan.tenGV}"></td>
                                                                    <td>
                                                                        <button
                                                                                type="button"
                                                                                class="btn btn-danger"
                                                                                data-toggle="modal"
                                                                                th:attr="onclick=|openModalRemoveHocKy('${phanCongHuongDan.getId()}')|">
                                                                            Xoá
                                                                        </button>
                                                                    </td>
                                                                </tr>
                                                            </th:block>
                                                            </tbody>
                                                        </table>
                                                        <!-- Paging-->
                                                        <nav th:if="${page.totalPages > 1}" aria-label="Page navigation">
                                                            <ul class="pagination justify-content-end">
                                                                <div th:each="i:${#numbers.sequence( 1, page.totalPages, 1)}">
                                                                    <li class="page-item">
                                                                        <a class="page-link"
                                                                           th:href="@{?page={page.currentPage}(page.currentPage=${i}-1)}"
                                                                           th:text="${i}">
                                                                        </a>
                                                                    </li>
                                                                </div>
                                                            </ul>
                                                        </nav>
                                                    </div>
                                                    <div th:if="${page.data.isEmpty()}">
                                                        <h3>Không có dữ liệu</h3>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- end:: Body -->
    </div>

    <div class="modal fade "
            id="modal_create"
            tabindex="-1"
            aria-labelledby="exampleModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-lg">
                
                <div class="modal-content">
                    <form id="form_add_phan_cong">
                        <div class="modal-header">
                            <h5 class="modal-title" id="exampleModalLabel">Thêm giáo viên</h5>
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">×</span>
                            </button>
                        </div>
                        <div class="modal-body" id="getMonDatnId" th:value="${monDatn.id}">
                            <div class="form-group">
                                <table id="custom-table"
                                    class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                    <thead>
                                    <th width="50px">STT</th>
                                    <th>Tên Giảng Viên</th>
                                    <th width="200px">Chức năng</th>
                                    </thead>
                                    <tbody>
                                    <th:block th:each="phanCongHuongDanGiaoVien : ${phanCongHuongDanGiaoViens}">
                                        <tr>
                                            <td th:text="${phanCongHuongDanGiaoVien.stt}"></td>
                                            <td th:text="${phanCongHuongDanGiaoVien.getTenGiaoVienHuongDan()}" class="giangVienId" th:value="${phanCongHuongDanGiaoVien.id}"></td>
                                            <td>
                                                <button
                                                        type="button"
                                                        class="btn btn-success"
                                                        data-toggle="modal"
                                                        th:attr="onclick=|addNew('${phanCongHuongDanGiaoVien.getId()}')|"
                                                        >
                                                    Thêm
                                                </button>
                                            </td>
                                        </tr>
                                    </th:block>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary"
                                    data-dismiss="modal">Hủy
                            </button>
                            <button type="submit" class="btn btn-success">Thêm tất cả
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    <!--  Start Modal Remove-->
    <div
        class="modal fade"
        id="modal_phan_cong_huong_dan_remove"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true">
    <div class="modal-dialog modal-lg modal-lg"
            role="document">
        <div class="modal-content">
            <form id="form_phan_cong_huong_dan_delete">
                <div class="modal-header">
                    <h5 class="modal-title">Xoá học kỳ</h5>
                    <button type="button" class="close"
                            data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>Bạn có muốn xoá không ?</p>
                    <span id="remove_phan_cong_huong_dan" style="color:red;"></span>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-dismiss="modal">Hủy
                    </button>
                    <button type="submit" class="btn btn-primary">Xoá
                    </button>
                </div>
            </form>
        </div>
    </div>
    <!--   End Modal Remove -->
    <script th:src="@{/assets/vendors/base/vendors.bundle.js}" type="text/javascript"></script>
    <script th:src="@{/assets/demo/default/base/scripts.bundle.js}" type="text/javascript"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.js"></script>
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
            integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
            crossorigin="anonymous"></script>
    <script th:src="@{/js/custom/daotao/phanCongHuongDan.js}" type="text/javascript"></script>
    </body>
</html>
