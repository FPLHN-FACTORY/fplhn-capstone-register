<!DOCTYPE html>
<html lang="en">
<!-- begin::Head -->
<head>
    <meta charset="utf-8"/>
    <title>Phân công hướng dẫn | FCR FPT Polytechnic</title>
    <meta name="description" content="Static table examples">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <link th:href="@{/assets/vendors/base/vendors.bundle.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/demo/default/base/style.bundle.css}" rel="stylesheet" type="text/css"/>
    <link rel="shortcut icon" href="https://ap.poly.edu.vn/images/favicon.ico"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/plugin/query-ui.css}">
    <link th:href="@{/css/custom/button-icon.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/css/plugin/bootstrap.min.css}" rel="stylesheet" type="text/css"/>
</head>
<body class="m-page--fluid m--skin- m-content--skin-light2 m-header--fixed m-header--fixed-mobile m-aside-left--enabled m-aside-left--skin-dark m-aside-left--fixed m-aside-left--offcanvas m-footer--push m-aside--offcanvas-default">

<!-- begin:: Page -->
<div class="m-grid m-grid--hor m-grid--root m-page">

    <div th:insert="~{fragment/header-fragment :: header}"></div>

    <!-- begin::Body -->
    <div class="m-grid__item m-grid__item--fluid m-grid m-grid--ver-desktop m-grid--desktop m-body">

        <div th:insert="~{fragment/menu-fragment-dao-tao :: menu}"></div>

        <!-- END: Left Aside -->
        <div class="m-grid__item m-grid__item--fluid m-wrapper">
            <!-- END: Subheader -->
            <div>
                <div>
                    <h3 style="margin: 50px 0 0 50px;">Phân môn GVHD</h3>
                    <div class="m-content" style="margin: 50px ; background-color: #fff;">
                        <div id="main">
                            <div class="kt-grid__item kt-grid__item--fluid kt-app__content">
                                <div class="row">
                                    <div class="col-xl-12">
                                        <div class="kt-portlet">
                                            <form class="kt-form kt-form--label-right">
                                                <div class="kt-portlet__body">
                                                    <div class="kt-section kt-section--first">
                                                        <div class="kt-section__body">
                                                            <div class="row">
                                                                <label class="col-xl-3"></label>
                                                                <div class="col-lg-9 col-xl-6">
                                                                    <h3 class="kt-section__title kt-section__title-sm"
                                                                        style="margin: 20px 0 ;">Thông tin chi tiết
                                                                        giảng viên</h3>
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-xl-3 col-lg-3 col-form-label">Tên
                                                                    giảng viên hướng dẫn:</label>
                                                                <div class="col-lg-9 col-xl-6">
                                                                    <input type="text"
                                                                           th:value="${giangVienHuongDan.tenTaiKhoan} + ' - ' +${giangVienHuongDan.tenGvhd}"
                                                                           readonly="readonly" class="form-control">
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-xl-3 col-lg-3 col-form-label">SĐT:</label>
                                                                <div class="col-lg-9 col-xl-6">
                                                                    <input type="text"
                                                                           th:value="${giangVienHuongDan.soDienThoai}"
                                                                           readonly="readonly" class="form-control">
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-xl-3 col-lg-3 col-form-label">Email
                                                                    FPT:</label>
                                                                <div class="col-lg-9 col-xl-6">
                                                                    <input type="text"
                                                                           th:value="${giangVienHuongDan.emailFpt}"
                                                                           readonly="readonly" class="form-control">
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-xl-3 col-lg-3 col-form-label">Email
                                                                    FE:</label>
                                                                <div class="col-lg-9 col-xl-6">
                                                                    <input type="text"
                                                                           th:value="${giangVienHuongDan.emailFe}"
                                                                           readonly="readonly" class="form-control">
                                                                </div>
                                                            </div>
                                                            <div class="form-group row">
                                                                <label class="col-xl-3 col-lg-3 col-form-label">Tên đợt
                                                                    đăng ký:</label>
                                                                <div class="col-lg-9 col-xl-6">
                                                                    <input type="text"
                                                                           th:value="${giangVienHuongDan.tenDotDangKy}"
                                                                           readonly="readonly" class="form-control">
                                                                </div>
                                                            </div>
                                                            <div class="row" style="padding: 20px 0 ;">
                                                                <label class="col-xl-3 col-lg-3 col-form-label"></label>
                                                                <div class="col-lg-9 col-xl-6">
                                                                    <a th:href="@{/dao-tao/giang-vien-huong-dan}"
                                                                       class="btn-secondary btn btn-light">
                                                                        Quay lại
                                                                    </a>
                                                                    <button type="button"
                                                                            th:attr="onclick=|openPhanCong()|"
                                                                            class="btn btn-success">
                                                                        Phân môn GVHD
                                                                    </button>

                                                                    <button data-bs-toggle="modal" data-bs-target="#history"
                                                                            type="button"
                                                                            th:attr="onclick=|openModalHistory(0, 20)|"
                                                                            class="btn btn-success">
                                                                        Lịch sử
                                                                    </button>
                                                                    <div class="modal fade" id="history" tabindex="-1" aria-labelledby="historyLabel" aria-hidden="true">
                                                                        <div class="modal-dialog modal-lg">
                                                                            <div class="modal-content">
                                                                                <div class="modal-header">
                                                                                    <h5 class="modal-title" id="historyLabel">Lịch sử</h5>
                                                                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                                                </div>
                                                                                <div class="modal-body">
                                                                                    <div class="form-group">
                                                                                        <table
                                                                                                style="text-align: center"
                                                                                                class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                                                                            <thead>
                                                                                            <th class="text-center align-middle" width="50px">STT</th>
                                                                                            <th class="text-center align-middle">Email người thực hiện</th>
                                                                                            <th class="text-center align-middle">Ngày thực hiện</th>
                                                                                            <th class="text-center align-middle">Nội dung</th>
                                                                                            <th class="text-center align-middle">Chức Vụ</th>
                                                                                            </thead>
                                                                                            <tbody id="listHistory">

                                                                                            </tbody>
                                                                                        </table>

                                                                                        <div style="text-align: right">
                                                                                            <div id="pageHistory" style="float: right;">
                                                                                            </div>
                                                                                            <div style="float: right; margin-right: 20px">
                                                                                                <select id="sizeHistory"
                                                                                                        th:attr="onchange=|openModalHistory(0, 0)|"
                                                                                                        class="form-control-sm">
                                                                                                    <option value="20">20</option>
                                                                                                    <option value="50">50</option>
                                                                                                    <option value="100">100</option>
                                                                                                    <option value="500">500</option>
                                                                                                    <option value="1000">1000</option>
                                                                                                </select>
                                                                                            </div>
                                                                                        </div>
                                                                                        <div id="emptyHistory">
                                                                                        </div>
                                                                                    </div>
                                                                                </div>
                                                                                <div class="modal-footer">
                                                                                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Đóng</button>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                    <button
                                                                            type="button"
                                                                            th:attr="onclick=|openModalHistoryDownload()|"
                                                                            class="btn btn-success">
                                                                        Tải file log
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="m-content" style="margin: 50px; background-color: #fff;">
                        <div>
                            <div class="kt-grid__item kt-grid__item--fluid kt-app__content">
                                <div class="row">
                                    <div class="col-xl-12">
                                        <div class="kt-portlet">
                                            <div class="kt-section__body">
                                                <div class="row">
                                                    <label class="col-xl-3"></label>
                                                    <div class="col-lg-9 col-xl-6">
                                                        <h3 class="kt-section__title kt-section__title-sm"
                                                            style="margin: 20px 0 ;">Danh sách môn đồ án tốt nghiệp</h3>
                                                    </div>
                                                </div>
                                                <div class="table-responsive mt-3" style="overflow: hidden;">
                                                    <div id="form_search"
                                                         class="m-portlet__body">
                                                        <div>
                                                            <div class="row justify-content-between align-items-center">
                                                                <span for="" class="fillter-name col-3 text-end">Tìm kiếm mã, tên môn</span>
                                                                <div class="col-7">
                                                                    <input type="text" class="form-control"
                                                                           name="keyword" id="keyword">
                                                                </div>
                                                                <div class="col-2">
                                                                    <button type="button" data-bs-dismiss="modal"
                                                                            class="btn btn-success"
                                                                            onclick="viewTable(0)">Tìm
                                                                        kiếm
                                                                    </button>
                                                                </div>
                                                            </div>

                                                        </div>
                                                    </div>
                                                    <div class="table-responsive mt-3">
                                                        <div th:unless="${page.data.isEmpty()}">
                                                            <table id="custom-table"
                                                                   style="text-align: center"
                                                                   class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                                                <thead class="table-primary">
                                                                <th width="50px">STT</th>
                                                                <th>Mã môn</th>
                                                                <th>Tên môn</th>
                                                                <th width="100px">Chức năng</th>
                                                                </thead>
                                                                <tbody id="list">
                                                                <th:block th:each="phanCongHuongDan : ${page.data}">
                                                                    <tr class="table-light">
                                                                        <td th:text="${phanCongHuongDan.stt}"></td>
                                                                        <td th:text="${phanCongHuongDan.MaMonDatn}"></td>
                                                                        <td th:text="${phanCongHuongDan.MonDatn}"></td>
                                                                        <td style="display: flex; justify-content: center">
                                                                            <button
                                                                                    class="btn_trash"
                                                                                    data-toggle="tooltip"
                                                                                    title="Xóa"
                                                                                    th:attr="onclick=|openModalRemovePhanCongHuongDan('${giangVienHuongDan.getId()}', '${phanCongHuongDan.getId()}')|">
                                                                                <img th:src="@{/img/trash.svg}" alt="">
                                                                            </button>
                                                                        </td>
                                                                    </tr>
                                                                </th:block>
                                                                </tbody>
                                                            </table>
                                                            <!-- Paging-->
                                                            <div id="list_page">
                                                            </div>
                                                            <input hidden th:value="${page.totalPages}" id="totalPages">
                                                            <input hidden th:value="${page.currentPage}"
                                                                   id="currentPage">
                                                            <div id="is_empty" class="text-center">
                                                                <div th:if="${page.data.isEmpty()}">
                                                                    <span>Không có dữ liệu</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div th:if="${page.data.isEmpty()}">
                                                            <h3>Không có dữ liệu</h3>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- end:: Body -->
    </div>

    <div class="modal fade "
         id="modal_create"
         tabindex="-1"
         aria-labelledby="exampleModalLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-lg">

            <div class="modal-content">
                <div id="form_add_phan_cong">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Phân môn</h5>
                        <button type="button" class="close" data-bs-dismiss="modal"
                                aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <input type="text" id="getDotDangKyId" th:value="${giangVienHuongDan.getIdDotDangKy()}" hidden>
                    <input type="text" id="getGiangVienHuongDanId" th:value="${giangVienHuongDan.getId()}" hidden>
                    <div class="modal-body">
                        <div class="row g-2 align-items-center pb-4">
                            <div class="col-auto col-3">
                                <span for="" class="fillter-name text-center">Tìm mã, tên môn</span>
                            </div>
                            <div class="col-auto col-7">
                                <input type="text" class="form-control" name="keyword" id="searchPhanCong"
                                >
                            </div>
                            <div class="col-auto col-2">
                                <button type="button"
                                        class="btn btn-primary" th:attr="onclick=|viewTablePhanCongHuongDan(0, 0)|"
                                >Tìm kiếm
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <table id="table-add"
                                   style="text-align: center"
                                   class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                <thead class="table-primary">
                                <th width="50px">STT</th>
                                <th>Mã môn</th>
                                <th>Tên môn</th>
                                <th width="100px">Chọn</th>
                                </thead>
                                <tbody id="add-giang-vien">
                                </tbody>
                            </table>
                        </div>
                        <div id="errLoi" style="color:red"></div>

                        <div style="text-align: right">
                            <div id="pageAdd" style="float: right;">
                            </div>
                            <div>
                                <select id="sizeAdd"
                                        th:attr="onchange=|viewTablePhanCongHuongDan(0, 0)|"
                                        class="form-control-sm">
                                    <option value="20">20</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                    <option value="500">500</option>
                                    <option value="1000">1000</option>
                                </select>
                            </div>
                        </div>
                        <div id="emptyAdd">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary btn btn-light" data-bs-dismiss="modal">
                            Hủy
                        </button>
                        <input class="btn btn-success" onclick="checkAll()" value="Chọn tất cả" type="button"/>
                        <button type="button" class="btn btn-success" th:attr="onclick=|phanCong()|">Thêm
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!--   End Modal Remove -->
<script th:src="@{/assets/vendors/base/vendors.bundle.js}" type="text/javascript"></script>
<script th:src="@{/assets/demo/default/base/scripts.bundle.js}" type="text/javascript"></script>
<script src="https://code.jquery.com/jquery-3.3.1.js"></script>
<script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
<script th:src="@{/js/custom/common/loadding.js}" type="text/javascript"></script>
<script th:src="@{/js/custom/daotao/dtPhanMonDatn.js}" type="text/javascript"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.js}"></script>
<script th:src="@{/js/plugin/bootbox.min.js}"></script>
</body>
</html>
