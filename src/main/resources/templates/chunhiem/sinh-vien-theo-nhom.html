<!DOCTYPE html>
<html lang="en">
<!-- begin::Head -->
<head>
    <meta charset="utf-8"/>
    <title>Project Register System</title>
    <meta name="description" content="Static table examples">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <link th:href="@{/assets/vendors/base/vendors.bundle.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/demo/default/base/style.bundle.css}" rel="stylesheet" type="text/css"/>
    <link rel="shortcut icon" href="https://ap.poly.edu.vn/images/favicon.ico"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/plugin/query-ui.css}">
</head>
<!-- end::Head -->

<!-- begin::Body -->
<body class="m-page--fluid m--skin- m-content--skin-light2 m-header--fixed m-header--fixed-mobile m-aside-left--enabled m-aside-left--skin-dark m-aside-left--fixed m-aside-left--offcanvas m-footer--push m-aside--offcanvas-default">

<!-- begin:: Page -->
<div class="m-grid m-grid--hor m-grid--root m-page">

    <div th:insert="~{fragment/header_fragment :: header}"></div>

    <!-- begin::Body -->
    <div class="m-grid__item m-grid__item--fluid m-grid m-grid--ver-desktop m-grid--desktop m-body">

        <div th:insert="~{fragment/menu_fragment :: menu}"></div>

        <!-- END: Left Aside -->
        <div class="m-grid__item m-grid__item--fluid m-wrapper">
            <!-- END: Subheader -->
            <div>
                <div class="m-content">
                    <h3>Quản lý sinh viên theo nhóm</h3>
                    <div class="mt-5">
                        <section class="fillter-area  mb-5">
                            <div class="m-portlet">
                                <div class="m-portlet__head">
                                    <div class="m-portlet__head-caption">
                                        <div class="m-portlet__head-title">
                                <span class="m-portlet__head-icon">
                                    <i class="m-menu__link-icon flaticon-web"></i>
                                </span>
                                            <h3 class="m-portlet__head-text">
                                                Bộ lọc
                                            </h3>
                                        </div>
                                    </div>
                                </div>
                                <!--                                <form-->
                                <!--                                        th:action="@{/hoc-ky/list}"-->
                                <!--                                        method="GET"-->
                                <!--                                        class="m-portlet__body">-->
                                <!--                                    <div class="row">-->
                                <!--                                        <div-->
                                <!--                                                class="form-group d-inline col-md-6 col-12 d-flex justify-content-around align-items-center">-->
                                <!--                                            <span for="" class="fillter-name col-4 text-center">Tên học kỳ</span>-->
                                <!--                                            <input type="text" class="form-control col-8" name="keyword" id="keyword"-->
                                <!--                                                   value="">-->
                                <!--                                        </div>-->
                                <!--                                    </div>-->

                                <!--                                    <div class="row justify-content-center pt-2">-->
                                <!--                                        <div class="col-sm-2 col-12 text-center mt-2">-->
                                <!--                                            <button type="submit" class="btn btn-primary">Tìm kiếm</button>-->
                                <!--                                        </div>-->
                                <!--                                        <div class="col-sm-2 col-12 text-center mt-2">-->
                                <!--                                            <a href="#"-->
                                <!--                                               class="btn btn-danger text-white" onclick="clearData();">-->
                                <!--                                                Làm mới bộ lọc-->
                                <!--                                            </a>-->
                                <!--                                        </div>-->
                                <!--                                    </div>-->
                                <!--                                </form>-->
                            </div>
                        </section>

                        <div class="m-portlet">
                            <div class="m-portlet">
                                <div class="m-portlet__body">
                                    <div class="row">
                                        <div class="col-6 d-inline"
                                        >
                                            <button
                                                    data-toggle="modal"
                                                    data-target="#modal_create"
                                                    class="col-12 col-sm-8 col-md-4 btn btn-success">
                                                Thêm thành viên
                                            </button>
                                            <div class="modal fade "
                                                 id="modal_create"
                                                 tabindex="-1"
                                                 aria-labelledby="exampleModalLabel"
                                                 aria-hidden="true">
                                                <div class="modal-dialog modal-lg">
                                                    <div class="modal-content">
                                                        <form id="form_create_ma_nhom">
                                                            <div class="modal-header">
                                                                <h5 class="modal-title" id="exampleModalLabel">Thêm thành viên
                                                                </h5>
                                                                <button type="button" class="close" data-dismiss="modal"
                                                                        aria-label="Close">
                                                                    <span aria-hidden="true">&times;</span>
                                                                </button>
                                                                <input hidden th:value="${idNhom}" id="idNhom">
                                                            </div>
                                                            <div class="modal-body">
                                                                <div class="form-group">
                                                                    <label class="col-form-label">Nhập id sinh viên tương ứng</label>
                                                                    <input
                                                                            type="text"
                                                                            class="form-control"
                                                                            id="maSinhVien">
                                                                </div>
                                                                <div class="modal-footer">
                                                                    <button type="button" class="btn btn-secondary"
                                                                            data-dismiss="modal">Hủy
                                                                    </button>
                                                                    <button type="submit" class="btn btn-primary">Thêm thành viên
                                                                    </button>
                                                                </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="table-responsive mt-3">
                                        <div th:unless="${page.data.isEmpty()}">
                                        <table id="custom-table"
                                               class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                            <thead>
                                            <th width="50px">STT</th>
                                            <th>Mã số sinh viên</th>
                                            <th>Họ tên</th>
                                            <th>Chuyên ngành</th>
                                            <th>Đợt đăng ký</th>
                                            <th>Tên nhóm</th>
                                            <th width="200px">Giáo viên hướng dẫn</th>
                                            <th>Chức năng</th>
                                            </thead>
                                            <tbody>
                                            <th:block th:each="sinhVienResponse,i : ${page.data}">
                                                <tr>
                                                    <td th:text="${i.count}"></td>
                                                    <td th:text="${sinhVienResponse.maSinhVien}"></td>
                                                    <td th:text="${sinhVienResponse.tenSinhVien}"></td>
                                                    <td th:text="${sinhVienResponse.tenChuyenNganh}"></td>
                                                    <td th:text="${sinhVienResponse.tenDotDangKy}"></td>
                                                    <td th:text="${sinhVienResponse.tenNhom}"></td>
                                                    <td th:text="${sinhVienResponse.tenGvhd}"></td>
                                                    <td>
                                                        <button
                                                                type="button"
                                                                class="btn btn-danger"
                                                                data-toggle="modal"
                                                                th:attr="onclick=|openModalRemoveNhom('${sinhVienResponse.maSinhVien}')|">
                                                            Kick
                                                        </button>
                                                        </button>
                                                    </td>
                                                </tr>
                                            </th:block>
                                            </tbody>
                                        </table>
                                        <!-- Paging-->
                                                                                <nav aria-label="Page navigation ">
                                                                                    <ul class="pagination justify-content-end">
                                                                                        <div th:each="i:${#numbers.sequence( 1, page.totalPages, 1)}">
                                                                                            <li class="page-item">
                                                                                                <a class="page-link"
                                                                                                   th:href="@{/chunhiem/sinh-vien-theo-nhom?page={page.currentPage}(page.currentPage=${i}-1)}"
                                                                                                   th:text="${i}">
                                                                                                </a>
                                                                                            </li>
                                                                                        </div>
                                                                                    </ul>
                                                                                </nav>
                                        </div>
                                        <div th:if="${page.data.isEmpty()}">
                                            <h3>Không có dữ liệu</h3>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- end:: Body -->
</div>
<!--  Start Modal Update-->
<div
        class="modal fade"
        tabindex="-1"
        id="modal_update_hoc_ky"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true">
    <div class="modal-dialog modal-lg modal-lg"
         role="document">
        <div class="modal-content">
            <form id="form_hoc_ky_update">
                <div class="modal-header">
                    <h5 class="modal-title">Cập
                        nhật học kỳ</h5>
                    <button type="button" class="close"
                            data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label
                                class="col-form-label">ID Học Kỳ</label>
                        <input
                                type="text"
                                class="form-control"
                                id="id_hoc_ky_update"/>
                    </div>
                    <div class="form-group">
                        <label
                                class="col-form-label">Tên Học
                            Kỳ</label>
                        <input
                                type="text"
                                class="form-control"
                                id="ten_hoc_ky_update"/>
                        <small class="text-danger"
                               id="errorMessageUpdate"></small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-dismiss="modal">Hủy
                    </button>
                    <button type="submit" class="btn btn-primary">Cập
                        nhật
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<!--   End Modal Update -->

<!--  Start Modal Remove-->
<div
        class="modal fade"
        id="modal_sinh_vien_theo_nhom_remove"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true">
    <div class="modal-dialog modal-lg modal-lg"
         role="document">
        <div class="modal-content">
            <form id="form_hoc_ky_delete">
                <div class="modal-header">
                    <h5 class="modal-title">Xoá học kỳ</h5>
                    <button type="button" class="close"
                            data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>Bạn có muốn kick không?</p>
                    <span id="remove_sinh_vien_theo_nhom" style="color:red;"></span>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-dismiss="modal">Hủy
                    </button>
                    <button type="submit" class="btn btn-primary">Kick
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<!--   End Modal Remove -->
<script th:src="@{/assets/vendors/base/vendors.bundle.js}" type="text/javascript"></script>
<script th:src="@{/assets/demo/default/base/scripts.bundle.js}" type="text/javascript"></script>
<script src="https://code.jquery.com/jquery-3.3.1.js"></script>
<script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
<script th:src="@{/js/custom/chunhiem/sinhVienTheoNhom.js}" type="text/javascript"></script>
</body>
</html>
