<!DOCTYPE html>
<html lang="en">
<!-- begin::Head -->
<head>
    <meta charset="utf-8"/>
    <title>Quản lý nhóm DATN | FCR FPT Polytechnic</title>
    <meta name="description" content="Static table examples">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <link th:href="@{/assets/vendors/base/vendors.bundle.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/demo/default/base/style.bundle.css}" rel="stylesheet" type="text/css"/>
    <link rel="shortcut icon" href="https://ap.poly.edu.vn/images/favicon.ico"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/plugin/query-ui.css}">
    <link th:href="@{/css/custom/chosen.css}" rel="stylesheet"/>
    <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <!-- CSS only -->
    <link th:href="@{/css/plugin/bootstrap.min.css}" rel="stylesheet" type="text/css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.0.1/css/toastr.css" rel="stylesheet"/>
    <link href="/css/custom/button-icon.css" rel="stylesheet">
    <style>
        #th-hanh-dong {
            width: 165px;
            overflow: hidden;
        }

        #eye-custom {
            text-align: center;
            border: 1px solid white;
            border-radius: 7px;
            width: 35px;
            height: 35px;
            line-height: 30px;
            background: #1abb32;
            float: left;
        }

        .ui-autocomplete {
            z-index: 2147483647;
        }
    </style>
</head>
<!-- end::Head -->

<!-- begin::Body -->
<body class="m-page--fluid m--skin- m-content--skin-light2 m-header--fixed m-header--fixed-mobile m-aside-left--enabled m-aside-left--skin-dark m-aside-left--fixed m-aside-left--offcanvas m-footer--push m-aside--offcanvas-default">

<!-- begin:: Page -->
<div class="m-grid m-grid--hor m-grid--root m-page">

    <div th:insert="~{fragment/header-fragment :: header}"></div>

    <!-- begin::Body -->
    <div class="m-grid__item m-grid__item--fluid m-grid m-grid--ver-desktop m-grid--desktop m-body">

        <div th:insert="~{fragment/menu-fragment-chu-nhiem :: menu}"></div>

        <!-- END: Left Aside -->
        <div id="content" class="m-grid__item m-grid__item--fluid m-wrapper">
            <!-- END: Subheader -->
            <div>
                <div class="m-content">
                    <div class="row">
                        <div class="col-6">
                            <h3>Danh sách giảng viên hướng dẫn theo đợt</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end">
                            <a target="_blank" th:href="${youtubeLink}" class="btn btn-success" data-toggle="tooltip"
                               title="Hướng dẫn sử dụng">
                                <i class="fas fa-info-circle"></i> HDSD
                            </a>
                        </div>
                    </div>
                    <div class="mt-5">
                        <section class="fillter-area  mb-5">
                            <div class="m-portlet">
                                <div class="m-portlet__head">
                                    <div class="m-portlet__head-caption">
                                        <div class="m-portlet__head-title">
                                <span class="m-portlet__head-icon">
                                    <i class="m-menu__link-icon flaticon-web"></i>
                                </span>
                                            <h3 class="m-portlet__head-text">
                                                Bộ lọc
                                            </h3>
                                        </div>
                                    </div>
                                </div>
                                <br>
                                <form id="form_list_nhom_datn">
                                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                                    <div class="row">
                                        <div
                                                class="form-group d-inline col-md-6 col-12 d-flex justify-content-around align-items-center">
                                            <span for=""
                                                  class="fillter-name col-4 text-center">Tên tài khoản/Tên GVHD:</span>
                                            <input type="text" class="form-control col-7"
                                                   name="maGvhd" id="maGvhd"
                                                   value="">
                                        </div>
                                        <div
                                                class="form-group d-inline col-md-6 col-12 d-flex justify-content-around align-items-center">
                                            <span for="" class="fillter-name col-4 text-center">Số nhóm đang hướng dẫn/tối đa:</span>
                                            <input type="number" class="form-control col-7"
                                                   name="soNhomHuongDanToiDa" id="soNhomHuongDanToiDa"
                                                   value="">
                                        </div>
                                        <div
                                                class="form-group d-inline col-md-6 col-12 d-flex justify-content-around align-items-center">
                                            <span for="" class="fillter-name col-4 text-center">Môn Datn:</span>
                                            <select class="form-control col-7"
                                                    id="monDatnId" name="monDatnId">
                                                <option value="">Tất cả</option>
                                                <option th:each="item : ${listMonDatn}" th:value="${item.getId()}"
                                                        th:text="${item.getName()}"></option>
                                            </select>
                                        </div>
                                        <div class="form-group d-inline col-md-6 col-12 d-flex justify-content-around align-items-center"
                                        >
                                            <span for="" class="fillter-name col-4 text-center">Đợt đăng ký:</span>
                                            <select class="form-control col-7"
                                                    id="dotDangKyId" name="dotDangKyId">
                                                <option value="">Chọn đợt đăng ký</option>
                                                <option th:each="item : ${listDotDangKy}"
                                                        th:value="${item.getId()}"
                                                        th:text="${item.getName()}"></option>
                                            </select>
                                        </div>
                                        <div class="form-group d-inline col-md-6 col-12 d-flex justify-content-around align-items-center"
                                        >
                                            <span for="" class="fillter-name col-4 text-center">Chuyên ngành:</span>
                                            <select class="form-control col-7"
                                                    id="chuyenNganhId" name="chuyenNganhId">
                                                <option value="">Tất cả</option>
                                                <option th:each="item : ${listChuyenNganh}"
                                                        th:value="${item.getId()}"
                                                        th:text="${item.getName()}"></option>
                                            </select>
                                        </div>
                                        <div class="form-group d-inline col-md-6 col-12 d-flex justify-content-around align-items-center"
                                        >
                                            <span for="" class="fillter-name col-4 text-center">Sắp xếp:</span>
                                            <select class="form-control col-7"
                                                    id="sortGvhd" name="sortGvhd">
                                                <option value="sortDesc">Theo SL nhóm đang hướng dẫn giảm dần
                                                </option>
                                                <option value="sortAsc">Theo SL nhóm đang hướng dẫn tăng dần
                                                </option>
                                                <option value="sortMaxDesc">Theo SL nhóm hướng dẫn tối đa giảm dần
                                                </option>
                                                <option value="sortMaxAsc">Theo SL nhóm hướng dẫn tối đa tăng dần
                                                </option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="row justify-content-center">
                                        <div class="col-sm-1 col-12 text-center mt-2">
                                            <button type="button"
                                                    th:attr="onclick=|loadDataGvhd(0)|"
                                                    class="btn btn-primary">Tìm kiếm
                                            </button>
                                        </div>
                                        <div class="col-sm-1 col-12 text-center mt-2">
                                            <a href="#" class="btn btn-danger text-white" onclick="clearData();">
                                                Làm mới bộ lọc
                                            </a>
                                        </div>
                                    </div>
                                </form>
                                <br>
                            </div>
                        </section>

                        <div class="m-portlet">
                            <div class="m-portlet">
                                <div class="m-portlet__body">
                                    <div class="row">
                                        <div class="col-6 d-inline">
                                            <div class="row" style="flex-wrap: nowrap">

                                            </div>
                                        </div>
                                        <div class="table-responsive mt-3">
                                            <div>
                                                <table id="custom-table"
                                                       style="text-align: center"
                                                       class="table table-bordered m-table d-sm-table m-table--head-bg-primary">
                                                    <thead class="table-primary">
                                                    <th class="text-center align-middle" width="50px">STT</th>
                                                    <th class="text-center align-middle">Họ và tên</th>
                                                    <th class="text-center align-middle">Email</th>
                                                    <th class="text-center align-middle">Số điện thoại</th>
                                                    <th class="text-center align-middle">Môn hướng dẫn</th>
                                                    <th class="text-center align-middle">Số nhóm đang HD / tối đa</th>
                                                    </thead>
                                                    <tbody id="listGvhd">
                                                    <th:block th:each="gvhd : ${listGvhd.data}">
                                                        <tr class="table-light">
                                                            <td class="text-center align-middle" th:text="${gvhd.getStt()}"></td>
                                                            <td class="text-center align-middle" th:text="${gvhd.name}"></td>
                                                            <td class="text-center align-middle" th:text="${gvhd.email}"></td>
                                                            <td class="text-center align-middle" th:text="${gvhd.soDienThoai}"></td>
                                                            <td class="text-center align-middle" th:text="${gvhd.monDatn}"></td>
                                                            <td class="text-center align-middle" th:text="${gvhd.soNhomDangHuongDan} + '/' + ${gvhd.soNhomHuongDanToiDa}"></td>
                                                        </tr>
                                                    </th:block>
                                                    </tbody>
                                                </table>
                                                <nav
                                                        aria-label="Page navigation">
                                                    <div class="justify-content-end"
                                                         style="display: flex;">
                                                        <ul class="pagination" id="page">
                                                        </ul>
                                                    </div>
                                                </nav>
                                            </div>
                                            <div id="empty">
                                                <input hidden id="checkData" th:value="${listGvhd.data.isEmpty()}">
                                                <div th:if="${listGvhd.data.isEmpty()}">
                                                    <h3>Không có dữ liệu</h3>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <input hidden th:value="${listGvhd.totalPages}" id="totalPages">
    <input hidden th:value="${listGvhd.currentPage}" id="currentPage">
    <!-- end:: Body -->
</div>
<script th:src="@{/assets/vendors/base/vendors.bundle.js}" type="text/javascript"></script>
<script th:src="@{/assets/demo/default/base/scripts.bundle.js}" type="text/javascript"></script>
<script src="https://code.jquery.com/jquery-3.3.1.js"></script>
<script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
<!-- JavaScript Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.js}"></script>
<script th:src="@{/js/plugin/bootbox.min.js}"></script>
<script th:src="@{/js/plugin/bootbox.locales.min.js}"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
<script th:src="@{/js/custom/common/loadding.js}" type="text/javascript"></script>
<script th:src="@{/js/custom/chunhiem/CnGiangVienHuongDan.js}" type="text/javascript"></script>
</body>
</html>
